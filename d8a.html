<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조합론 15문제 — 정답 및 완전 해설</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#050e0a;--deep:#091410;--card:#0f1e18;--card2:#142820;
  --border:#1c3828;--border2:#254e38;--faint:#2e6448;
  --muted:#4a8a68;--dim:#6aaa88;--text:#c0e8d0;--bright:#e4f8ec;
  --em:#00e87a;--em2:#40f0a0;--em3:#80f8c0;
  --teal:#00c8d8;--teal2:#40dce8;
  --gold:#f0c040;--gold2:#f8d870;
  --rose:#ff5060;--violet:#b070ff;--sky:#60c0ff;
  --ok-bg:rgba(0,232,122,.08);--ok-br:#00e87a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;line-height:1.8;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,232,122,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,232,122,.018) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 65% 45% at 50% -5%,rgba(0,200,216,.06),transparent);
  pointer-events:none;z-index:0;}

/* HEADER */
.site-hdr{position:sticky;top:0;z-index:100;background:rgba(5,14,10,.95);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);}
.site-hdr-in{max-width:1180px;margin:0 auto;padding:10px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
.site-brand{display:flex;flex-direction:column;gap:1px;}
.site-brand-sup{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);}
.site-brand-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--bright);}
.site-brand-title span{color:var(--em);text-shadow:0 0 8px rgba(0,232,122,.4);}
.jbar{display:flex;gap:3px;flex-wrap:wrap;max-width:500px;}
.jbtn{width:27px;height:27px;background:var(--card);border:1px solid var(--border2);
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;
  cursor:pointer;border-radius:2px;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.jbtn:hover{background:var(--border2);color:var(--text);}
.jbtn.act{background:var(--em);border-color:var(--em);color:var(--bg);font-weight:700;
  box-shadow:0 0 8px rgba(0,232,122,.4);}
.site-chips{display:flex;gap:8px;}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);border:1px solid var(--border2);padding:3px 10px;}

/* LAYOUT */
.layout{max-width:1180px;margin:0 auto;padding:32px 28px 100px;
  display:grid;grid-template-columns:264px 1fr;gap:28px;align-items:start;position:relative;z-index:1;}

/* SIDEBAR */
.sidebar{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;}
.sb{background:var(--card);border:1px solid var(--border2);overflow:hidden;}
.sb-hd{background:var(--card2);border-bottom:1px solid var(--border);padding:9px 16px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.ans-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border2);}
.ag-c{background:var(--card);padding:10px 6px;text-align:center;cursor:pointer;transition:background .15s;}
.ag-c:hover{background:var(--card2);}
.ag-q{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--faint);display:block;margin-bottom:4px;}
.ag-a{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--em);
  display:block;line-height:1;text-shadow:0 0 6px rgba(0,232,122,.3);}
.ag-p{font-size:9px;color:var(--faint);display:block;margin-top:3px;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border2);}
.sum-c{background:var(--card);padding:14px;text-align:center;}
.sum-n{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;display:block;line-height:1;}
.sum-l{font-size:10px;color:var(--muted);margin-top:3px;}
.toc{list-style:none;}
.toc-row{display:flex;align-items:flex-start;gap:10px;padding:8px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.toc-row:last-child{border-bottom:none;}
.toc-row:hover{background:var(--card2);}
.toc-row.act{background:rgba(0,232,122,.06);}
.toc-n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);min-width:22px;}
.toc-i{flex:1;min-width:0;}
.toc-t{font-size:12px;color:var(--text);line-height:1.35;}
.toc-c{font-family:'JetBrains Mono',monospace;font-size:9px;margin-top:1px;}
.toc-p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;}

/* CARDS */
.qfeed{display:flex;flex-direction:column;gap:40px;}
.qcard{background:var(--card);border:1px solid var(--border2);overflow:hidden;
  scroll-margin-top:84px;transition:border-color .2s;}
.qcard:hover{border-color:var(--faint);}
.qstripe{height:3px;}
.qhead{padding:20px 28px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:16px;}
.qnumbox{font-family:'Noto Serif KR',serif;font-size:58px;font-weight:900;
  color:var(--border2);line-height:1;min-width:68px;flex-shrink:0;letter-spacing:-3px;}
.qheadmeta{flex:1;}
.qcatrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.qcat{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;border:1px solid;padding:2px 8px;}
.qpts{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:2px 8px;}
.qtitle{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--bright);line-height:1.3;}
.qansbadge{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.qansbadge-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;}
.qansbadge-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--em);
  background:var(--ok-bg);border:1px solid var(--ok-br);padding:5px 14px;
  box-shadow:0 0 8px rgba(0,232,122,.15);}

.qbody{padding:20px 28px;border-bottom:1px solid var(--border);font-size:14.5px;line-height:2;color:var(--text);}
.qbody-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
.qbody p{margin-bottom:10px;}.qbody p:last-child{margin-bottom:0;}
.qbody strong{color:var(--em2);}
.qbody em{color:var(--gold);font-style:normal;font-weight:700;}
.scene{background:var(--card2);border:1px solid var(--border2);border-left:3px solid var(--gold);padding:14px 18px;margin:12px 0;font-size:14px;line-height:2;}
.scene-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);margin-bottom:7px;font-weight:700;}
.cbox{font-family:'JetBrains Mono',monospace;background:#020906;color:var(--em2);
  border:1px solid var(--border2);border-left:3px solid var(--em);
  padding:13px 17px;margin:10px 0;font-size:13px;line-height:1.9;overflow-x:auto;white-space:pre;}

.opts-sec{padding:16px 28px;border-bottom:1px solid var(--border);}
.opts-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
.opt-row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;margin-bottom:6px;border:1px solid var(--border2);font-size:13.5px;line-height:1.7;}
.opt-row:last-child{margin-bottom:0;}
.opt-row.correct{border-color:var(--ok-br);background:var(--ok-bg);}
.opt-lbl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--faint);min-width:22px;padding-top:1px;flex-shrink:0;}
.opt-row.correct .opt-lbl{color:var(--em);}
.opt-txt{color:var(--text);font-size:13.5px;}
.opt-ck{margin-left:auto;font-size:16px;flex-shrink:0;}

.expl-sec{padding:0;}
.expl-banner{background:rgba(0,0,0,.4);border-bottom:1px solid var(--border2);
  padding:11px 22px;margin:0 28px;display:flex;align-items:center;gap:12px;}
.expl-icon{width:30px;height:30px;border:1px solid var(--em);display:flex;align-items:center;
  justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:700;color:var(--em);flex-shrink:0;box-shadow:0 0 8px rgba(0,232,122,.2);}
.expl-title-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.concept-row{background:rgba(0,200,216,.06);border-bottom:1px solid var(--border);
  padding:10px 28px;display:flex;align-items:flex-start;gap:10px;}
.concept-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--teal2);border:1px solid var(--teal);padding:2px 10px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.concept-desc{font-size:13px;color:var(--muted);line-height:1.75;}
.ans-tag-wrap{padding:0 28px;}
.ans-tag{display:inline-block;background:var(--ok-bg);border:1px solid var(--ok-br);
  color:var(--em);font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:5px 16px;margin-top:16px;font-weight:600;box-shadow:0 0 8px rgba(0,232,122,.15);}
.expl-body{padding:20px 28px 26px;font-size:14px;line-height:2;color:var(--dim);}
.expl-body p{margin-bottom:10px;}.expl-body p:last-child{margin-bottom:0;}
.expl-body strong{color:var(--sky);}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider-txt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;white-space:nowrap;}
.step{font-family:'JetBrains Mono',monospace;background:#020906;
  border:1px solid var(--border2);border-left:3px solid var(--violet);
  padding:16px 20px;margin:12px 0;font-size:12.5px;line-height:1.95;
  white-space:pre-wrap;overflow-x:auto;color:#90c8b0;}
.formula{background:rgba(0,232,122,.05);border:1px solid rgba(0,232,122,.2);
  border-left:3px solid var(--em);padding:14px 18px;margin:12px 0;
  font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.9;
  color:var(--em2);white-space:pre-wrap;}
.tip{background:rgba(240,192,64,.06);border-left:3px solid var(--gold);
  padding:11px 16px;margin:12px 0;font-size:13px;line-height:1.75;color:var(--muted);}
.tip-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;font-weight:700;}

@media(max-width:960px){.layout{grid-template-columns:1fr;}.sidebar{position:static;}.jbar,.site-chips{display:none;}}
@media(max-width:600px){.qhead{flex-direction:column;}.qnumbox{font-size:38px;}.qbody,.expl-body{padding:16px;}.opts-sec{padding:12px 16px;}.expl-banner,.concept-row,.ans-tag-wrap{padding-left:16px;padding-right:16px;}.expl-banner{margin:0 16px;}}
</style>
</head>
<body>

<div class="site-hdr">
  <div class="site-hdr-in">
    <div class="site-brand">
      <span class="site-brand-sup">KOI 중등부 · 조합론 특강</span>
      <div class="site-brand-title">정답 및 <span>완전 해설</span></div>
    </div>
    <div class="jbar" id="jbar"></div>
    <div class="site-chips"><div class="chip">15문항</div><div class="chip">150점</div></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sb">
      <div class="sb-hd">📊 배점 요약</div>
      <div class="sum-grid">
        <div class="sum-c"><span class="sum-n" style="color:var(--em)">150</span><div class="sum-l">총 배점</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--teal)">15</span><div class="sum-l">총 문항</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--gold)">8~12</span><div class="sum-l">문항 배점</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--rose)">60</span><div class="sum-l">제한(분)</div></div>
      </div>
    </div>
    <div class="sb"><div class="sb-hd">✅ 정답 한눈에</div><div class="ans-grid" id="ans-grid"></div></div>
    <div class="sb"><div class="sb-hd">📋 문제 목록</div><ul class="toc" id="toc"></ul></div>
  </aside>
  <main><div class="qfeed" id="feed"></div></main>
</div>

<script>
var LBLS=['①','②','③','④','⑤'];

// ══════════════════════════════════════════════════════════════
// 15문제 완전 해설 — 조합론
// ══════════════════════════════════════════════════════════════
var QS=[

{id:1,pts:8,cat:'순열·조합 기초',catC:'#00e87a',ans:0,
title:'순열과 조합 계산',
opts:['210','35','5040','420','840'],
body:'<p>서로 다른 7명 중 회장·부회장·총무를 각 1명씩 뽑는 경우의 수는?</p>',
concept:{key:'순열 P(n,r) = n!/(n-r)!',val:'역할이 구별되므로 순서 중요 → 순열. P(7,3)=7×6×5=210.'},
expl:'<div class="step">역할이 구별 → 순열 P(7,3)\n\nP(7,3) = 7 × 6 × 5 = 210\n\n자리별 계산:\n  회장:   7명 중 1명\n  부회장: 남은 6명 중 1명\n  총무:   남은 5명 중 1명\n  합: 7 × 6 × 5 = 210\n\n참고: 역할 구별 없이 3명 선택 → C(7,3)=35</div>',
formula:'순열: P(n,r) = n!/(n-r)!\n조합: C(n,r) = n!/(r!(n-r)!)\n\nP(n,r) = C(n,r) × r!\n\nP(7,3) = 7!/4! = 210\nC(7,3) = 7!/(3!4!) = 35',
tip:{title:'P vs C 구분법',text:'역할(직책, 순서)이 구별되면 순열. 그냥 몇 명을 고르면 조합. "회장, 부회장처럼 다른 역할"→순열. "대표 3명"→조합.'}},

{id:2,pts:8,cat:'조합·이항계수',catC:'#00c8d8',ans:0,
title:'이항계수와 파스칼 삼각형',
opts:['330','462','252','210','336'],
body:'<p><strong>C(10,3) + C(10,4)</strong>의 값은?</p>',
concept:{key:'파스칼 항등식 C(n,r)+C(n,r+1)=C(n+1,r+1)',val:'C(10,3)+C(10,4)=C(11,4)=330.'},
expl:'<div class="step">파스칼 항등식:\n  C(n,r) + C(n,r+1) = C(n+1,r+1)\n\nC(10,3) + C(10,4) = C(11,4)\n\nC(11,4) = 11!/(4!·7!)\n        = (11×10×9×8)/(4×3×2×1)\n        = 7920/24\n        = 330\n\n검증:\n  C(10,3)=120, C(10,4)=210\n  120+210=330 ✓</div>',
formula:'파스칼 항등식:\n  C(n,r) + C(n,r+1) = C(n+1,r+1)\n\n이 문제:\n  C(10,3)+C(10,4) = C(11,4) = 330\n\nC(11,4) = 11×10×9×8 / 4! = 330',
tip:{title:'파스칼 삼각형 성질',text:'n행의 합=2ⁿ. 가운데 값이 최대. 대각합=피보나치. 이항정리: (1+x)ⁿ=ΣC(n,k)xᵏ.'}},

{id:3,pts:8,cat:'중복순열',catC:'#00e87a',ans:0,
title:'중복 허용 순열',
opts:['100','125','80','60','96'],
body:'<p>0~4 다섯 숫자로 세 자리 자연수 (중복 허용, 첫 자리 0 불가) 개수는?</p>',
concept:{key:'자리별 독립 계산',val:'첫째:1~4(4가지), 둘째:0~4(5가지), 셋째:0~4(5가지). 4×5×5=100.'},
expl:'<div class="step">세 자리 자연수 조건:\n  첫째 자리: 0 제외 → {1,2,3,4} = 4가지\n  둘째 자리: {0,1,2,3,4} = 5가지\n  셋째 자리: {0,1,2,3,4} = 5가지\n\n총: 4 × 5 × 5 = 100\n\n검증 (여사건):\n  전체 5³=125\n  첫째=0인 것: 1×5²=25\n  125-25=100 ✓</div>',
formula:'중복순열:\n  n가지 중 r개 중복 선택(순서 있음)\n  = nʳ\n\n조건부:\n  첫째 0 불가: (n-1)×nʳ⁻¹\n  = 4×5²= 100',
tip:{title:'중복순열 vs 중복조합',text:'중복순열: 순서 있음, nʳ. 중복조합: 순서 없음, H(n,r)=C(n+r-1,r). 비밀번호(순서 있음)→중복순열. 색 선택(순서 없음)→중복조합.'}},

{id:4,pts:10,cat:'중복조합',catC:'#00c8d8',ans:0,
title:'중복조합 H(n,r)',
opts:['70','56','35','126','84'],
body:'<p>5가지 종류 구슬 중 중복 허용하여 4개 선택하는 경우의 수는?</p>',
concept:{key:'중복조합 H(n,r)=C(n+r-1,r)',val:'H(5,4)=C(8,4)=70.'},
expl:'<div class="step">중복조합: 5가지 중 4개 (순서 무관, 중복 허용)\n\nH(5,4) = C(5+4-1, 4)\n       = C(8, 4)\n       = 8!/(4!×4!)\n       = (8×7×6×5)/(4×3×2×1)\n       = 1680/24\n       = 70</div>',
formula:'중복조합:\n  H(n,r) = C(n+r-1, r)\n         = C(n+r-1, n-1)\n\nH(5,4) = C(8,4) = 70\n\n직관: 별(4개)과 막대(4개)\n  C(8,4) = 70가지 배열',
tip:{title:'별과 막대 (Stars and Bars)',text:'n종류 r개 선택 = r개의 별과 n-1개의 막대를 배열. C(n+r-1, r). 예: 빵 3종류 5개 → C(7,5)=21.'}},

{id:5,pts:10,cat:'이항정리',catC:'#00e87a',ans:0,
title:'이항정리 계수 구하기',
opts:['720','360','1080','240','960'],
body:'<p>(2x+3)⁵ 전개에서 <strong>x³</strong>의 계수는?</p>',
concept:{key:'이항정리 일반항',val:'x³항: r=2 (3^r=3²). C(5,2)×2³×3²=10×8×9=720.'},
expl:'<div class="step">(2x+3)⁵ 일반항:\n  C(5,r)·(2x)^(5-r)·3^r\n\nx³항: 2x의 지수=3 → 5-r=3 → r=2\n\nx³ 계수:\n  C(5,2) × 2³ × 3²\n  = 10 × 8 × 9\n  = 720</div>',
formula:'이항정리:\n  (a+b)ⁿ = Σ C(n,r)·aⁿ⁻ʳ·bʳ\n  r=0,1,...,n\n\n(2x+3)⁵의 x³항 (r=2):\n  C(5,2)·(2x)³·3² = 10·8·9·x³ = 720x³',
tip:{title:'지수로 r 결정',text:'(ax+b)ⁿ에서 xᵏ항: (n-r)=k이므로 r=n-k. 그 다음 C(n,r)·aⁿ⁻ʳ·bʳ 계산. 계수만 원하면 x 없이 숫자만 곱하면 됨.'}},

{id:6,pts:10,cat:'격자 경로',catC:'#00c8d8',ans:0,
title:'격자 위의 최단 경로',
opts:['126','210','252','84','120'],
body:'<p>(0,0)에서 (5,4)까지 →·↑만으로 이동하는 최단 경로의 수는?</p>',
concept:{key:'격자 경로 C(m+n,n)',val:'총 9번 이동 중 ↑를 4번 배치. C(9,4)=126.'},
expl:'<div class="step">오른쪽(→) 5번 + 위(↑) 4번 = 총 9번\n\n경로 = 9번 이동 중 ↑ 4번의 위치 선택\n     = C(9,4)\n     = 9!/(4!×5!)\n     = (9×8×7×6)/(4×3×2×1)\n     = 3024/24\n     = 126</div>',
formula:'(0,0)→(m,n) 최단 경로:\n  C(m+n, n) = C(m+n, m)\n\n(0,0)→(5,4):\n  C(9,4) = C(9,5) = 126\n\n특정 점 P 경유: (0,0)→P × P→(m,n)',
tip:{title:'격자 경로와 파스칼 삼각형',text:'격자 (i,j)에 도달하는 경로 수 = C(i+j,j). 파스칼 삼각형의 각 항이 격자 경로 수와 동일. 장애물 있는 경우: 반사 원리 또는 포함-배제.'}},

{id:7,pts:10,cat:'원형 순열',catC:'#00e87a',ans:0,
title:'원형 배열의 경우의 수',
opts:['120','720','360','240','60'],
body:'<p>서로 다른 구슬 6개를 원형으로 배열하는 경우의 수는?</p>',
concept:{key:'원형 순열 (n-1)!',val:'(6-1)!=5!=120.'},
expl:'<div class="step">원형 순열: 회전이 같은 것을 하나로 처리\n\n방법 1: 하나 고정, 나머지 배열\n  한 자리 고정 → 5개 배열 = 5! = 120\n\n방법 2: 일반 순열 / 회전 수\n  6! / 6 = 720 / 6 = 120\n\n목걸이(뒤집기도 동일):\n  5!/2 = 60</div>',
formula:'원형 순열:\n  (n-1)! = 5! = 120\n\n이유: 일반 순열 n!을 회전 수 n으로 나눔\n  n!/n = (n-1)!\n\n목걸이 순열: (n-1)!/2',
tip:{title:'원형 vs 목걸이',text:'원형 순열: 회전이 같으면 동일 (n-1)!. 목걸이: 회전+뒤집기가 같으면 동일 (n-1)!/2. 구슬이 일부 같으면 버언사이드 보조정리.'}},

{id:8,pts:10,cat:'비인접 조합',catC:'#00c8d8',ans:0,
title:'비인접 조건의 경우의 수',
opts:['35','42','28','56','21'],
body:'<p>1~9 중 어떤 두 수도 연속이 아닌 3개를 선택하는 경우의 수는?</p>',
concept:{key:'비인접 조합 C(n-r+1,r)',val:'C(9-3+1,3)=C(7,3)=35.'},
expl:'<div class="step">비인접 조합 공식: C(n-r+1, r)\n  n=9, r=3\n\nC(9-3+1, 3) = C(7, 3) = 35\n\n변환으로 증명:\n  a₁<a₂<a₃, 차이≥2 조건\n  bᵢ = aᵢ-(i-1)로 치환\n  b₁<b₂<b₃, 1≤bᵢ≤7 (조건 없음)\n  → C(7,3)=35 ✓</div>',
formula:'비인접 조합:\n  1~n에서 r개, 어느 두 수도 연속 아님\n  = C(n-r+1, r)\n\nn=9, r=3:\n  C(7,3) = 35\n\n더 일반화: 차이≥d 조건\n  C(n-(r-1)(d-1), r)',
tip:{title:'bᵢ=aᵢ-(i-1) 변환',text:'비인접 제약을 없애는 표준 변환. a₁<a₂<a₃이고 연속 아님 → bᵢ=aᵢ-(i-1)로 치환 → b들은 평범한 순증가수열. 직관: 이미 선택된 것들 사이 간격 1씩 당김.'}},

{id:9,pts:10,cat:'방정식의 정수해',catC:'#00e87a',ans:0,
title:'방정식의 음이 아닌 정수해',
opts:['66','55','78','45','91'],
body:'<p>x+y+z=10의 음이 아닌 정수해의 개수는?</p>',
concept:{key:'중복조합 H(3,10)=C(12,2)=66',val:'3변수에 10을 분배 = H(3,10)=C(12,2)=66.'},
expl:'<div class="step">x+y+z=10, x,y,z≥0인 정수해\n\n= 3가지 변수에 10 분배\n= H(3,10)\n= C(3+10-1, 10)\n= C(12, 2)\n= 12×11/2\n= 66\n\n별과 막대:\n  ○○...○ (10개 별) | (2개 막대)\n  12자리 중 막대 위치: C(12,2)=66</div>',
formula:'x₁+x₂+...+xₖ=n (xᵢ≥0)\n  해의 수 = H(k,n) = C(k+n-1, n)\n\nx+y+z=10:\n  H(3,10) = C(12,2) = 66\n\nx≥1 조건: 치환 x\'=x-1 후 H(3,7)=C(9,2)=36',
tip:{title:'조건 변환',text:'xᵢ≥aᵢ 조건: xᵢ\'=xᵢ-aᵢ로 치환. xᵢ\'≥0이 되고 합이 n-Σaᵢ로 줄어듦. 예: x,y,z≥1이면 H(3,7)=36.'}},

{id:10,pts:10,cat:'카탈란 수',catC:'#00c8d8',ans:0,
title:'카탈란 수와 괄호 쌍',
opts:['14','42','5','132','28'],
body:'<p>여는 괄호 4개, 닫는 괄호 4개로 만드는 올바른 괄호 쌍의 수 C₄는?</p>',
concept:{key:'카탈란 수 Cₙ=C(2n,n)/(n+1)',val:'C₄=C(8,4)/5=70/5=14.'},
expl:'<div class="step">카탈란 수 Cₙ = C(2n,n)/(n+1)\n\nn=4:\nC₄ = C(8,4) / (4+1)\n   = 70 / 5\n   = 14\n\n처음 몇 항:\n  C₀=1, C₁=1, C₂=2, C₃=5\n  C₄=14, C₅=42, C₆=132\n\n점화식: Cₙ = Σ Cᵢ·Cₙ₋₁₋ᵢ (i=0~n-1)</div>',
formula:'카탈란 수:\n  Cₙ = C(2n,n)/(n+1)\n     = C(2n,n) - C(2n,n-1)\n\nC₄ = C(8,4)/5 = 70/5 = 14\n\n점화식:\n  C₀=1, Cₙ₊₁=Cₙ×2(2n+1)/(n+2)',
tip:{title:'카탈란 수의 응용',text:'올바른 괄호 쌍, 대각선 아래 격자 경로, 볼록 n+2각형 삼각분할, 완전 이진 트리 모양, 비교 정렬 순서 등 매우 다양. 조합론의 핵심 상수.'}},

{id:11,pts:10,cat:'비둘기집 원리',catC:'#00e87a',ans:0,
title:'비둘기집 원리 심화',
opts:['비둘기 101개, 상자 100개','비둘기 200개, 상자 101개','비둘기 101개, 상자 101개','비둘기 100개, 상자 50개','비둘기 200개, 상자 100개'],
body:'<p>1~200에서 101개 선택 시 서로소인 두 수가 반드시 존재함을 증명. 비둘기와 상자의 수는?</p>',
concept:{key:'연속쌍 100개=상자, 선택101개=비둘기',val:'쌍 (1,2),(3,4),...,(199,200): 100쌍. 101개>100개→같은 쌍 포함.'},
expl:'<div class="step">연속 정수 쌍 (비둘기집=상자):\n  (1,2), (3,4), (5,6), ..., (199,200)\n  → 총 100쌍 = 100개 상자\n\n101개의 수를 선택 = 101마리 비둘기\n\n비둘기집 원리:\n  101 > 100\n  → 어느 쌍에서 두 수 모두 선택됨\n  → GCD(n,n+1)=1 (연속 정수)\n  → 서로소인 두 수 반드시 존재 ✓</div>',
formula:'비둘기집 원리:\n  n+1마리 > n상자\n  → 어느 상자에 2마리 이상\n\n이 문제:\n  상자=100쌍, 비둘기=101개\n  101>100 → 같은 쌍에서 2개 선택\n  → 연속수 → 서로소',
tip:{title:'비둘기집 원리의 힘',text:'수의 집합을 적절히 분류하면(상자 설계) 많은 존재성 증명이 가능. 핵심: 상자를 어떻게 정의하느냐. 생일 문제, 라미 정리, 해시 충돌 모두 비둘기집.'}},

{id:12,pts:10,cat:'다항정리',catC:'#00c8d8',ans:0,
title:'다항정리 계수',
opts:['12','6','24','4','8'],
body:'<p>(x+y+z)⁴ 전개에서 <strong>x²yz</strong>의 계수는?</p>',
concept:{key:'다항계수 n!/(a₁!a₂!...aₖ!)',val:'x²yz: 지수 2,1,1, 합=4. 4!/(2!1!1!)=12.'},
expl:'<div class="step">(x+y+z)⁴에서 x²yz 계수\n\n지수: x→2, y→1, z→1\n합: 2+1+1=4 ✓\n\n다항계수:\n  4! / (2! × 1! × 1!)\n  = 24 / (2 × 1 × 1)\n  = 12</div>',
formula:'다항정리:\n  (x₁+...+xₖ)ⁿ에서\n  x₁^a₁...xₖ^aₖ의 계수\n  = n!/(a₁!···aₖ!)  (a₁+...+aₖ=n)\n\nx²yz: 4!/(2!1!1!) = 12',
tip:{title:'다항계수와 경우의 수',text:'4개를 x용 2개, y용 1개, z용 1개로 배분하는 방법=4!/(2!1!1!)=12. 이항정리는 k=2인 특수 경우. 다항계수는 중복 배열과 동일.'}},

{id:13,pts:12,cat:'완전 순열',catC:'#00e87a',ans:0,
title:'자리 제한 순열 (완전 순열 D₄)',
opts:['9','10','8','12','6'],
body:'<p>4명을 일렬로 세울 때 모두가 자기 자리가 아닌 자리에 서는 경우의 수 D₄는?</p>',
concept:{key:'완전 순열 Dₙ=n!(1-1+1/2!-1/3!+...)',val:'D₄=24(1/2-1/6+1/24)=12-4+1=9.'},
expl:'<div class="step">완전 순열 공식:\n  Dₙ = n! × (1 - 1/1! + 1/2! - 1/3! + ... + (-1)ⁿ/n!)\n\nD₄ = 4! × (1 - 1 + 1/2 - 1/6 + 1/24)\n   = 24 × (12/24 - 4/24 + 1/24)\n   = 24 × 9/24\n   = 9\n\n점화식 검증:\n  Dₙ = (n-1)(Dₙ₋₁+Dₙ₋₂)\n  D₁=0, D₂=1, D₃=2, D₄=3(2+1)=9 ✓</div>',
formula:'완전 순열(교란순열):\n  Dₙ = n!·Σ(-1)ᵏ/k!  (k=0~n)\n\n점화식:\n  Dₙ = (n-1)(Dₙ₋₁+Dₙ₋₂)\n  D₁=0, D₂=1, D₃=2, D₄=9\n\nDₙ ≈ n!/e (큰 n에서)',
tip:{title:'완전 순열 근사',text:'Dₙ ≈ n!/e ≈ 0.3679·n!. 큰 n에서 완전 순열의 비율은 1/e≈36.8%로 수렴. 포함-배제 원리의 가장 아름다운 응용.'}},

{id:14,pts:12,cat:'스털링 수',catC:'#00c8d8',ans:0,
title:'집합의 분할 (제2종 스털링 수)',
opts:['25','30','15','20','35'],
body:'<p>5개의 서로 다른 공을 3개의 구별 없는 상자에 넣되 빈 상자 없는 경우의 수 S(5,3)은?</p>',
concept:{key:'제2종 스털링 수 S(n,k)',val:'S(n,k)=k·S(n-1,k)+S(n-1,k-1). S(5,3)=3×6+7=25.'},
expl:'<div class="step">점화식: S(n,k) = k·S(n-1,k) + S(n-1,k-1)\n\n스털링 수 테이블:\n  S(1,1)=1\n  S(2,1)=1, S(2,2)=1\n  S(3,1)=1, S(3,2)=3,  S(3,3)=1\n  S(4,1)=1, S(4,2)=7,  S(4,3)=6,  S(4,4)=1\n  S(5,1)=1, S(5,2)=15, S(5,3)=?,  S(5,4)=10, S(5,5)=1\n\nS(5,3) = 3·S(4,3) + S(4,2)\n       = 3·6 + 7\n       = 18+7 = 25</div>',
formula:'제2종 스털링 수 S(n,k):\n  S(n,k) = k·S(n-1,k) + S(n-1,k-1)\n  S(n,1)=1, S(n,n)=1\n\nS(5,3) = 25\n\n벨 수 Bₙ = ΣS(n,k):\n  B₁=1,B₂=2,B₃=5,B₄=15,B₅=52',
tip:{title:'스털링 수 해석',text:'S(n,k): n원소를 k개의 비어있지 않은 비구별 그룹으로 분할. 구별 가능한 상자이면 k!·S(n,k). 벨 수 Bₙ=Σ_k S(n,k): 모든 분할 수.'}},

{id:15,pts:12,cat:'동전 분배',catC:'#00e87a',ans:0,
title:'제약 조건이 있는 분배',
opts:['9','10','12','8','11'],
body:'<p>1원, 5원, 10원으로 정확히 20원을 만드는 방법의 수는? (각 0개 이상 사용)</p>',
concept:{key:'경우 분류로 직접 열거',val:'10원 개수(0,1,2)로 나눠 5원과 1원 조합. 5+3+1=9가지.'},
expl:'<div class="step">10a+5b+c=20, a,b,c≥0\n\na=2: 5b+c=0 → (b,c)=(0,0)        → 1가지\na=1: 5b+c=10 → b=0,1,2\n  (0,10),(1,5),(2,0)               → 3가지\na=0: 5b+c=20 → b=0,1,2,3,4\n  (0,20),(1,15),(2,10),(3,5),(4,0) → 5가지\n\n총: 1+3+5 = 9가지</div>',
formula:'동전 문제:\n  10a+5b+1c=20\n  a∈{0,1,2}로 경우 분류\n\na=2: 1가지\na=1: 3가지  (b=0,1,2)\na=0: 5가지  (b=0,1,2,3,4)\n합: 9가지\n\n생성함수: x²⁰ 계수 = 9',
tip:{title:'생성함수 접근',text:'(1+x+x²+...)(1+x⁵+x¹⁰+...)(1+x¹⁰+x²⁰+...)에서 x²⁰의 계수. 동전 종류가 많거나 금액이 크면 생성함수나 DP가 효율적.'}},

  bw.appendChild(bl);bw.appendChild(bc);card.appendChild(bw);

  // options
  var os=document.createElement('div');os.className='opts-sec';
  var ol=document.createElement('div');ol.className='opts-lbl';ol.textContent='▸ 선택지';os.appendChild(ol);
  q.opts.forEach(function(o,oi){
    var row=document.createElement('div');row.className='opt-row'+(oi===q.ans?' correct':'');
    var lbl=document.createElement('span');lbl.className='opt-lbl';lbl.textContent=LBLS[oi];
    var txt=document.createElement('span');txt.className='opt-txt';txt.textContent=o;
    row.appendChild(lbl);row.appendChild(txt);
    if(oi===q.ans){var ck=document.createElement('span');ck.className='opt-ck';ck.textContent='✅';row.appendChild(ck);}
    os.appendChild(row);
  });
  card.appendChild(os);

  // explanation
  var es=document.createElement('div');es.className='expl-sec';
  var banner=document.createElement('div');banner.className='expl-banner';
  var eic=document.createElement('div');eic.className='expl-icon';eic.textContent='解';
  var etl=document.createElement('span');etl.className='expl-title-lbl';etl.textContent='상세 풀이 및 해설';
  banner.appendChild(eic);banner.appendChild(etl);es.appendChild(banner);
  if(q.concept){
    var cr=document.createElement('div');cr.className='concept-row';
    var ct=document.createElement('div');ct.className='concept-tag';ct.textContent=q.concept.key;
    var cv=document.createElement('div');cv.className='concept-desc';cv.textContent=q.concept.val;
    cr.appendChild(ct);cr.appendChild(cv);es.appendChild(cr);
  }
  var atw=document.createElement('div');atw.className='ans-tag-wrap';
  var at=document.createElement('div');at.className='ans-tag';at.textContent='정답: '+LBLS[q.ans]+' '+q.opts[q.ans];
  atw.appendChild(at);es.appendChild(atw);
  var eb=document.createElement('div');eb.className='expl-body';
  var d1=document.createElement('div');d1.className='divider';
  var dt1=document.createElement('span');dt1.className='divider-txt';dt1.textContent='단계별 풀이';
  d1.appendChild(dt1);eb.appendChild(d1);
  var ec=document.createElement('div');ec.innerHTML=q.expl;eb.appendChild(ec);
  if(q.formula){
    var d2=document.createElement('div');d2.className='divider';
    var dt2=document.createElement('span');dt2.className='divider-txt';dt2.textContent='핵심 공식';
    d2.appendChild(dt2);eb.appendChild(d2);
    var fb=document.createElement('div');fb.className='formula';fb.textContent=q.formula;eb.appendChild(fb);
  }
  if(q.tip){
    var d3=document.createElement('div');d3.className='divider';
    var dt3=document.createElement('span');dt3.className='divider-txt';dt3.textContent='팁 & 응용';
    d3.appendChild(dt3);eb.appendChild(d3);
    var tb=document.createElement('div');tb.className='tip';
    var tt=document.createElement('div');tt.className='tip-t';tt.textContent='💡 '+q.tip.title;
    var tx=document.createElement('div');tx.textContent=q.tip.text;
    tb.appendChild(tt);tb.appendChild(tx);eb.appendChild(tb);
  }
  es.appendChild(eb);card.appendChild(es);feed.appendChild(card);
});

// Intersection Observer
var obs=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      var i=parseInt(e.target.id.replace('q',''));
      document.querySelectorAll('.jbtn').forEach(function(b,j){b.classList.toggle('act',j===i);});
      document.querySelectorAll('.toc-row').forEach(function(t,j){t.classList.toggle('act',j===i);});
    }
  });
},{threshold:0.15,rootMargin:'-76px 0px -60% 0px'});
document.querySelectorAll('.qcard').forEach(function(el){obs.observe(el);});
</script>
</body>
</html>
