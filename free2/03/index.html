<style>
*{box-sizing:border-box}

}

.green{background:#16a34a;color:white}

}

<body>

<script>

", "choices": ["p", "q", "p∧q", "p∨q"], "answer": "p", "explain": "p∧q와 p∧¬q에서 p를 묶으면 p∧(q∨¬q)=p∧참=p입니다."}, {"unit": "논리식 단순화", "q": "논리식 p∨(p∧q)를 가장 간단히 하면?", "choices": ["p", "q", "p∧q", "p∨q"], "answer": "p", "explain": "흡수법칙입니다. p가 이미 참이면 전체가 참이고, p가 거짓이면 p∧q도 거짓이므로 전체는 p와 같습니다."}, {"unit": "한정자", "q": "자연수 전체에서 명제 '모든 n에 대해 n+1>n이다'의 진리값은?", "choices": ["참", "거짓", "명제가 아니다", "n이 정해져야 한다"], "answer": "참", "explain": "모든 자연수 n에 대해 n+1은 항상 n보다 큽니다."}, {"unit": "한정자", "q": "자연수 전체에서 '어떤 n이 존재하여 n<0이다'의 진리값은?", "choices": ["참", "거짓", "항상 참", "명제가 아니다"], "answer": "거짓", "explain": "자연수에는 0보다 작은 수가 없으므로 존재명제는 거짓입니다."}, {"unit": "한정자 부정", "q": "'모든 학생이 문제 1번을 맞혔다'의 부정은?", "choices": ["모든 학생이 문제 1번을 틀렸다", "문제 1번을 틀린 학생이 적어도 한 명 있다", "어떤 학생은 문제 1번을 맞혔다", "학생이 없다"], "answer": "문제 1번을 틀린 학생이 적어도 한 명 있다", "explain": "∀x P(x)의 부정은 ∃x ¬P(x)입니다. 전체가 아니라 반례 하나가 있으면 됩니다."}, {"unit": "한정자 순서", "q": "자연수에서 '모든 x에 대해 어떤 y가 존재하여 y>x이다'는 참이다. 그 이유로 가장 알맞은 것은?", "choices": ["y=0을 고르면 된다", "y=x+1을 고르면 된다", "x=y를 고르면 된다", "항상 같은 y를 고르면 된다"], "answer": "y=x+1을 고르면 된다", "explain": "x가 무엇이든 그보다 1 큰 자연수 x+1을 y로 고르면 됩니다."}, {"unit": "한정자 순서", "q": "자연수에서 '어떤 y가 존재하여 모든 x에 대해 y>x이다'는 거짓이다. 그 이유는?", "choices": ["자연수는 하나뿐이기 때문", "모든 자연수보다 큰 하나의 자연수는 없기 때문", "y가 음수이기 때문", "x가 정해지지 않았기 때문"], "answer": "모든 자연수보다 큰 하나의 자연수는 없기 때문", "explain": "어떤 y를 골라도 x=y+1을 선택하면 x가 y보다 커집니다."}, {"unit": "추론", "q": "전제 1: p→q, 전제 2: p가 참이다. 이때 q가 참이라고 결론 내리는 추론 규칙은?", "choices": ["긍정논법", "부정논법", "후건 긍정의 오류", "전건 부정의 오류"], "answer": "긍정논법", "explain": "p→q와 p로부터 q를 얻는 추론은 긍정논법입니다."}, {"unit": "추론", "q": "전제 1: p→q, 전제 2: ¬q가 참이다. 이때 ¬p를 결론으로 얻는 추론 규칙은?", "choices": ["긍정논법", "부정논법", "선언삼단논법", "후건 긍정의 오류"], "answer": "부정논법", "explain": "p→q와 ¬q에서 ¬p를 얻는 추론은 부정논법입니다."}, {"unit": "추론 오류", "q": "전제 '공부하면 합격한다'와 '합격했다'로부터 '공부했다'고 결론 내렸다. 이 추론의 문제점은?", "choices": ["항상 올바르다", "후건 긍정의 오류", "전건 부정의 오류", "드모르간 오류"], "answer": "후건 긍정의 오류", "explain": "q가 참이라고 해서 p가 참이라고 할 수 없습니다. 합격한 이유가 다른 것일 수 있습니다."}, {"unit": "추론 오류", "q": "전제 '비가 오면 땅이 젖는다'와 '비가 오지 않았다'로부터 '땅이 젖지 않았다'고 결론 내렸다. 이 추론의 오류는?", "choices": ["후건 긍정의 오류", "전건 부정의 오류", "긍정논법", "부정논법"], "answer": "전건 부정의 오류", "explain": "비가 오지 않아도 청소차나 물뿌리개 때문에 땅이 젖을 수 있습니다."}, {"unit": "복합 추론", "q": "p→q, q→r, p가 모두 참일 때 반드시 참인 것은?", "choices": ["r", "¬r", "q→p", "r→q"], "answer": "r", "explain": "p→q와 p로 q를 얻고, q→r와 q로 r을 얻습니다."}, {"unit": "복합 추론", "q": "p∨q가 참이고 p가 거짓이면 반드시 참인 것은?", "choices": ["q", "¬q", "p∧q", "p↔q"], "answer": "q", "explain": "p 또는 q 중 하나가 참인데 p가 거짓이면 q는 반드시 참입니다."}, {"unit": "거짓말쟁이", "q": "A는 'B는 거짓말쟁이다'라고 말했고, B는 'A와 나는 둘 다 진실만 말한다'라고 말했다. A가 진실만 말하는 사람이라면 B는?", "choices": ["진실만 말한다", "거짓말쟁이다", "판단할 수 없다", "둘 다 참이다"], "answer": "거짓말쟁이다", "explain": "A가 진실이면 A의 말 'B는 거짓말쟁이다'가 참입니다. 따라서 B는 거짓말쟁이입니다."}, {"unit": "거짓말쟁이", "q": "A는 '나는 거짓말쟁이가 아니다'라고 말했다. 이 말만으로 알 수 있는 것은?", "choices": ["A는 반드시 진실만 말한다", "A는 반드시 거짓말쟁이다", "A의 유형을 확정할 수 없다", "문장이 명제가 아니다"], "answer": "A의 유형을 확정할 수 없다", "explain": "진실한 사람도 이 말을 할 수 있고, 거짓말쟁이가 이 말을 하면 모순 구조가 됩니다. 문제 조건이 부족하면 확정할 수 없습니다."}, {"unit": "조건 분기", "q": "프로그램 조건문 if (A && !B)가 실행되었다. 반드시 참인 것은?", "choices": ["A는 참이고 B는 거짓", "A는 거짓이고 B는 참", "A와 B가 모두 참", "A와 B가 모두 거짓"], "answer": "A는 참이고 B는 거짓", "explain": "A && !B가 참이려면 A가 참이고, !B가 참이어야 하므로 B는 거짓입니다."}, {"unit": "조건 분기", "q": "프로그램 조건문 if (!(A || B))가 참이다. 동치인 조건은?", "choices": ["!A || !B", "!A && !B", "A && B", "A || !B"], "answer": "!A && !B", "explain": "드모르간 법칙에 의해 !(A||B)는 !A&&!B와 같습니다."}, {"unit": "경우 나누기", "q": "두 조건 p, q 중 정확히 하나만 참이어야 통과하는 규칙을 논리식으로 나타내면?", "choices": ["p∧q", "p∨q", "(p∧¬q)∨(¬p∧q)", "p↔q"], "answer": "(p∧¬q)∨(¬p∧q)", "explain": "정확히 하나만 참인 경우는 p만 참이거나 q만 참인 경우입니다. 이것은 XOR입니다."}, {"unit": "논리 퍼즐", "q": "세 조건 A, B, C가 있다. A가 참이면 B도 참이고, B가 참이면 C도 참이다. 그런데 C가 거짓이다. 반드시 거짓인 것은?", "choices": ["A", "B만", "A와 B", "알 수 없다"], "answer": "A와 B", "explain": "B→C와 ¬C에서 ¬B입니다. A→B와 ¬B에서 ¬A입니다. 따라서 A와 B가 모두 거짓입니다."}, {"unit": "논리 퍼즐", "q": "대회 규칙은 '문제 A를 풀었거나 문제 B를 풀었고, 문제 C도 풀어야 수상한다'이다. 논리식으로 가장 자연스러운 것은?", "choices": ["A∨B∧C", "(A∨B)∧C", "A∨(B∧C)", "A∧B∧C"], "answer": "(A∨B)∧C", "explain": "A 또는 B 중 하나 이상을 풀고, 동시에 C도 풀어야 하므로 (A∨B)∧C입니다."}, {"unit": "동치와 추론", "q": "명제 ¬(p∧q)와 p가 참일 때 반드시 참인 것은?", "choices": ["q", "¬q", "p∧q", "p↔q"], "answer": "¬q", "explain": "¬(p∧q)는 p와 q가 동시에 참이 아니라는 뜻입니다. p가 이미 참이면 q는 거짓이어야 합니다."}];
let current = 0;
let selected = Array(questions.length).fill(null);
let checked = Array(questions.length).fill(false);
let corrects = Array(questions.length).fill(false);

function renderNav(){
  const nav = document.getElementById('nav');
  const filter = document.getElementById('filter').value;
  nav.innerHTML = '';
  questions.forEach((q, i) => {
    if(filter !== 'all' && q.unit !== filter) return;
    const btn = document.createElement('button');
    btn.className = 'qnav' + (i===current ? ' active' : '') + (checked[i] ? (corrects[i] ? ' correct' : ' wrong') : '');
    btn.innerHTML = `<b>${i+1}.</b> ${q.unit}`;
    btn.onclick = () => { current = i; renderQuestion(); };
    nav.appendChild(btn);
  });
}

function renderQuestion(){
  const q = questions[current];
  document.getElementById('tag').textContent = `${current+1}번 · ${q.unit}`;
  document.getElementById('question').textContent = q.q;

  const choices = document.getElementById('choices');
  choices.innerHTML = '';
  q.choices.forEach(choice => {
    const div = document.createElement('div');
    div.className = 'choice';
    if(selected[current] === choice) div.classList.add('selected');
    if(checked[current] && choice === q.answer) div.classList.add('answer');
    if(checked[current] && selected[current] === choice && choice !== q.answer) div.classList.add('bad');
    div.textContent = choice;
    div.onclick = () => {
      if(checked[current]) return;
      selected[current] = choice;
      renderQuestion();
    };
    choices.appendChild(div);
  });

  const result = document.getElementById('result');
  result.className = 'result';
  result.innerHTML = '';

  const explain = document.getElementById('explain');
  explain.className = 'explain';
  explain.innerHTML = `<b>자세한 해설</b><br>${q.explain}`;

  if(checked[current]) {
    const ok = corrects[current];
    result.className = 'result show ' + (ok ? 'ok' : 'no');
    result.innerHTML = ok ? '정답입니다.' : `오답입니다. 정답은 <b>${q.answer}</b> 입니다.`;
  }

  updateStats();
  renderNav();
}

function checkAnswer(){
  if(selected[current] === null) {
    alert('먼저 답을 선택하세요.');
    return;
  }
  checked[current] = true;
  corrects[current] = selected[current] === questions[current].answer;
  renderQuestion();
}

function toggleExplain(){
  document.getElementById('explain').classList.toggle('show');
}

function nextQ(){
  current = (current + 1) % questions.length;
  renderQuestion();
}

function prevQ(){
  current = (current - 1 + questions.length) % questions.length;
  renderQuestion();
}

function updateStats(){
  const solved = checked.filter(Boolean).length;
  const correct = corrects.filter(Boolean).length;
  const score = solved ? Math.round(correct / solved * 100) : 0;
  document.getElementById('solved').textContent = solved;
  document.getElementById('correct').textContent = correct;
  document.getElementById('score').textContent = score + '%';
  document.getElementById('bar').style.width = (solved / questions.length * 100) + '%';
}

function resetAll(){
  if(!confirm('풀이 기록을 모두 지울까요?')) return;
  current = 0;
  selected = Array(questions.length).fill(null);
  checked = Array(questions.length).fill(false);
  corrects = Array(questions.length).fill(false);
  renderQuestion();
}

renderQuestion();
</script>
