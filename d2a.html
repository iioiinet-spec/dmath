<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그래프 이론 15문제 — 정답 및 완전 해설</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --void:#070b0f;
  --deep:#0d1117;
  --card:#111827;
  --card2:#162032;
  --border:#1e2d3d;
  --border2:#253650;
  --faint:#3a5070;
  --muted:#5a7a9a;
  --dim:#7a9ab8;
  --text:#c8ddf0;
  --bright:#e8f4ff;
  --cyan:#38bdf8;
  --cyan2:#7dd3fc;
  --emerald:#34d399;
  --emerald2:#6ee7b7;
  --amber:#fbbf24;
  --rose:#f87171;
  --violet:#a78bfa;
  --ok-bg:rgba(52,211,153,.08);
  --ok-br:#34d399;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--void);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;line-height:1.8;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,.06),transparent);
  pointer-events:none;z-index:0;
}

/* ── SITE HEADER ── */
.site-hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(7,11,15,.94);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.site-hdr-in{
  max-width:1180px;margin:0 auto;padding:10px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.site-brand{display:flex;flex-direction:column;gap:1px;}
.site-brand-sup{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);
}
.site-brand-title{
  font-family:'Noto Serif KR',serif;
  font-size:17px;font-weight:700;color:var(--bright);
}
.site-brand-title span{color:var(--cyan);}

.jbar{display:flex;gap:3px;flex-wrap:wrap;max-width:500px;}
.jbtn{
  width:27px;height:27px;background:var(--card);
  border:1px solid var(--border2);color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:10px;
  cursor:pointer;border-radius:2px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.jbtn:hover{background:var(--border2);color:var(--text);}
.jbtn.act{background:var(--cyan);border-color:var(--cyan);color:var(--void);font-weight:700;}

.site-chips{display:flex;gap:8px;}
.chip{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--faint);
  border:1px solid var(--border2);padding:3px 10px;
}

/* ── LAYOUT ── */
.layout{
  max-width:1180px;margin:0 auto;
  padding:32px 28px 100px;
  display:grid;grid-template-columns:264px 1fr;
  gap:28px;align-items:start;
  position:relative;z-index:1;
}

/* ── SIDEBAR ── */
.sidebar{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;}

.sb{background:var(--card);border:1px solid var(--border2);overflow:hidden;}
.sb-hd{
  background:var(--card2);border-bottom:1px solid var(--border);
  padding:9px 16px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:3px;text-transform:uppercase;color:var(--muted);
}

/* answer grid */
.ans-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border2);}
.ag-c{
  background:var(--card);padding:10px 6px;text-align:center;
  cursor:pointer;transition:background .15s;
}
.ag-c:hover{background:var(--card2);}
.ag-q{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--faint);display:block;margin-bottom:4px;}
.ag-a{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--emerald);display:block;line-height:1;}
.ag-p{font-size:9px;color:var(--faint);display:block;margin-top:3px;}

/* summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border2);}
.sum-c{background:var(--card);padding:14px;text-align:center;}
.sum-n{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;display:block;line-height:1;}
.sum-l{font-size:10px;color:var(--muted);margin-top:3px;}

/* toc */
.toc{list-style:none;}
.toc-row{
  display:flex;align-items:flex-start;gap:10px;padding:8px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;
}
.toc-row:last-child{border-bottom:none;}
.toc-row:hover{background:var(--card2);}
.toc-row.act{background:rgba(56,189,248,.06);}
.toc-n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);min-width:22px;}
.toc-i{flex:1;min-width:0;}
.toc-t{font-size:12px;color:var(--text);line-height:1.35;}
.toc-c{font-family:'JetBrains Mono',monospace;font-size:9px;margin-top:1px;}
.toc-p{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;}

/* ── QUESTION CARDS ── */
.qfeed{display:flex;flex-direction:column;gap:40px;}

.qcard{
  background:var(--card);border:1px solid var(--border2);overflow:hidden;
  scroll-margin-top:84px;transition:border-color .2s;
}
.qcard:hover{border-color:var(--faint);}
.qcard-stripe{height:3px;}

/* head */
.qhead{
  padding:20px 28px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:16px;
}
.qnumbox{
  font-family:'Noto Serif KR',serif;font-size:58px;font-weight:900;
  color:var(--border2);line-height:1;min-width:68px;flex-shrink:0;letter-spacing:-3px;
}
.qheadmeta{flex:1;}
.qcatrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.qcat{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;
  text-transform:uppercase;border:1px solid;padding:2px 8px;
}
.qpts{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber);padding:2px 8px;}
.qtitle{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--bright);line-height:1.3;}
.qansbadge{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.qansbadge-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;}
.qansbadge-val{
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--emerald);
  background:var(--ok-bg);border:1px solid var(--ok-br);padding:5px 14px;
}

/* body */
.qbody{
  padding:20px 28px;border-bottom:1px solid var(--border);
  font-size:14.5px;line-height:2;color:var(--text);
}
.qbody-lbl{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;
  text-transform:uppercase;color:var(--faint);margin-bottom:10px;
}
.qbody p{margin-bottom:10px;} .qbody p:last-child{margin-bottom:0;}
.qbody strong{color:var(--cyan2);}
.qbody em{color:var(--amber);font-style:normal;font-weight:700;}
.qbody ul,.qbody ol{margin:8px 0 8px 26px;line-height:2.3;}
.scene{background:var(--card2);border:1px solid var(--border2);border-left:3px solid var(--amber);padding:14px 18px;margin:12px 0;font-size:14px;line-height:2;}
.scene-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:7px;font-weight:700;}
.codebox{font-family:'JetBrains Mono',monospace;background:#020509;color:#7dd3fc;border:1px solid var(--border2);padding:13px 17px;margin:10px 0;font-size:13px;line-height:1.85;overflow-x:auto;white-space:pre;}
.tbl-w{margin:10px 0;overflow-x:auto;}
.qtbl{border-collapse:collapse;font-size:13.5px;}
.qtbl th{background:var(--card2);border:1px solid var(--border2);padding:7px 14px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-align:center;}
.qtbl td{border:1px solid var(--border);padding:8px 14px;text-align:center;color:var(--text);}
.qtbl td.hi{color:var(--cyan2);font-weight:700;}

/* options */
.opts-sec{padding:16px 28px;border-bottom:1px solid var(--border);}
.opts-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
.opt-row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;margin-bottom:6px;border:1px solid var(--border2);font-size:13.5px;line-height:1.7;}
.opt-row:last-child{margin-bottom:0;}
.opt-row.correct{border-color:var(--ok-br);background:var(--ok-bg);}
.opt-lbl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--faint);min-width:22px;padding-top:1px;flex-shrink:0;}
.opt-row.correct .opt-lbl{color:var(--emerald);}
.opt-ck{margin-left:auto;font-size:16px;flex-shrink:0;}

/* explanation */
.expl-sec{padding:0;}
.expl-banner{
  background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);
  padding:11px 22px;margin:0 28px;
  display:flex;align-items:center;gap:10px;
}
.expl-icon{
  width:28px;height:28px;border:1px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif KR',serif;font-style:italic;font-size:13px;color:var(--cyan);flex-shrink:0;
}
.expl-title-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}

.concept-row{
  background:rgba(167,139,250,.06);border-bottom:1px solid var(--border);
  padding:10px 28px;display:flex;align-items:flex-start;gap:10px;
}
.concept-key{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--violet);border:1px solid var(--violet);padding:2px 10px;white-space:nowrap;flex-shrink:0;margin-top:2px;
}
.concept-desc{font-size:13px;color:var(--muted);line-height:1.75;}

.ans-tag-wrap{padding:0 28px;}
.ans-tag{
  display:inline-block;background:var(--ok-bg);border:1px solid var(--ok-br);
  color:var(--emerald);font-family:'JetBrains Mono',monospace;
  font-size:12px;padding:5px 16px;margin-top:16px;font-weight:500;
}

.expl-body{padding:20px 28px 26px;font-size:14px;line-height:2;color:var(--dim);}
.expl-body p{margin-bottom:10px;} .expl-body p:last-child{margin-bottom:0;}
.expl-body strong{color:var(--cyan2);}

.divider{display:flex;align-items:center;gap:12px;margin:14px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider-txt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;white-space:nowrap;}

.step{
  font-family:'JetBrains Mono',monospace;background:#020509;
  border:1px solid var(--border2);border-left:3px solid var(--violet);
  padding:16px 20px;margin:12px 0;font-size:12.5px;line-height:1.95;
  white-space:pre-wrap;overflow-x:auto;color:#b8c8e0;
}
.tip{background:rgba(251,191,36,.06);border-left:3px solid var(--amber);padding:11px 16px;margin:12px 0;font-size:13px;line-height:1.75;color:var(--muted);}
.tip-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:4px;font-weight:700;}

.algo-box{
  background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.25);border-left:3px solid var(--cyan);
  padding:14px 18px;margin:12px 0;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.9;color:var(--cyan2);white-space:pre-wrap;
}

/* responsive */
@media(max-width:960px){.layout{grid-template-columns:1fr;}.sidebar{position:static;}.jbar,.site-chips{display:none;}}
@media(max-width:600px){.qhead{flex-direction:column;}.qnumbox{font-size:38px;}.qbody,.expl-body{padding:16px;}.opts-sec{padding:12px 16px;}.expl-banner,.concept-row,.ans-tag-wrap{padding-left:16px;padding-right:16px;}.expl-banner{margin:0 16px;}}
</style>
</head>
<body>

<div class="site-hdr">
  <div class="site-hdr-in">
    <div class="site-brand">
      <span class="site-brand-sup">KOI 중등부 · 그래프 이론 특강</span>
      <div class="site-brand-title">정답 및 <span>완전 해설</span></div>
    </div>
    <div class="jbar" id="jbar"></div>
    <div class="site-chips">
      <div class="chip">15문항</div>
      <div class="chip">150점</div>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">

    <div class="sb">
      <div class="sb-hd">📊 배점 요약</div>
      <div class="sum-grid">
        <div class="sum-c"><span class="sum-n" style="color:var(--cyan)">150</span><div class="sum-l">총 배점</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--amber)">15</span><div class="sum-l">총 문항</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--emerald)">8~12</span><div class="sum-l">문항 배점</div></div>
        <div class="sum-c"><span class="sum-n" style="color:var(--rose)">60</span><div class="sum-l">제한(분)</div></div>
      </div>
    </div>

    <div class="sb">
      <div class="sb-hd">✅ 정답 한눈에</div>
      <div class="ans-grid" id="ans-grid"></div>
    </div>

    <div class="sb">
      <div class="sb-hd">📋 문제 목록</div>
      <ul class="toc" id="toc"></ul>
    </div>

  </aside>

  <main>
    <div class="qfeed" id="feed"></div>
  </main>
</div>

<script>
var LBLS = ['①','②','③','④','⑤'];

// ══════════════════════════════════════════════════════════════
// 15문제 완전 해설 데이터
// ══════════════════════════════════════════════════════════════
var QS = [

{id:1,pts:8,cat:'그래프 기초',catC:'#38bdf8',
title:'그래프의 기본 성질',
ans:1,
opts:['모든 노드의 차수의 합은 7이다.','그래프에는 사이클이 존재한다.','그래프는 트리(tree)이다.','노드 6의 차수는 2이다.','그래프는 비연결 그래프이다.'],
body:'<p>무방향 그래프 G의 간선: 1-2, 1-3, 2-3, 2-4, 3-5, 4-5, 4-6 (노드 6개, 간선 7개)</p>',
concept:{key:'핸드셰이킹 보조정리',val:'모든 노드 차수의 합 = 간선 수 × 2. 사이클 존재 판별: 직접 경로 탐색 또는 간선 수 > 노드 수 - 1.'},
expl:'<div class="step">① 차수의 합 = 7 × 2 = 14  (7이 아님) ✗\n\n② 사이클: 1→2→3→1\n   간선 1-2 ✓, 2-3 ✓, 3-1 ✓  → 사이클 존재 ✓\n\n③ 트리 = 사이클 없는 연결 그래프\n   사이클 1-2-3-1 존재 → 트리 아님 ✗\n\n④ 노드 6의 차수: 간선 4-6 하나뿐 → 차수 = 1  (2가 아님) ✗\n\n⑤ 연결성: 1-2-3-4-5-6 모두 연결됨 ✗\n\n정답: ② 그래프에는 사이클 1-2-3-1이 존재한다.</div>',
algo:'핸드셰이킹: Σdeg(v) = 2|E|\n여기서 |E|=7 → 차수 합 = 14\n\n차수 목록:\n  노드1: deg=2 (1-2, 1-3)\n  노드2: deg=3 (1-2, 2-3, 2-4)\n  노드3: deg=3 (1-3, 2-3, 3-5)\n  노드4: deg=3 (2-4, 4-5, 4-6)\n  노드5: deg=2 (3-5, 4-5)\n  노드6: deg=1 (4-6)\n  합: 2+3+3+3+2+1 = 14 ✓',
tip:{title:'트리 판별 조건',text:'n개 노드의 트리 ↔ 연결 + 간선 수 = n-1. 이 그래프: 노드6, 간선7 → 7 ≠ 6-1=5 → 트리 아님.'}},

{id:2,pts:8,cat:'BFS 탐색',catC:'#34d399',
title:'BFS 방문 순서',
ans:1,
opts:['3','4','5','6','7'],
body:'<p>인접 리스트: 1:[2,3], 2:[1,4,5], 3:[1,6], 4:[2], 5:[2,7], 6:[3], 7:[5]. 노드 1에서 BFS. 같은 레벨은 번호 작은 것부터.</p>',
concept:{key:'BFS (너비 우선 탐색)',val:'큐(Queue) 사용. 시작 노드부터 거리 1, 2, 3… 순으로 방문. 비가중치 그래프 최단 거리.'},
expl:'<div class="step">BFS from 노드 1 (번호 오름차순):\n\n큐 초기: [1], 방문: {1}\n\n① 1 처리: 이웃 [2,3] 큐에 추가\n   큐: [2,3]  방문순서: 1, 2, 3\n\n② 2 처리: 이웃 [1,4,5] → 미방문 [4,5] 추가\n   큐: [3,4,5]  방문순서: 1, 2, 3, 4 ← 4번째!\n\n③ 3 처리: 이웃 [1,6] → 미방문 [6] 추가\n④ 4 처리: 이웃 [2] → 없음\n⑤ 5 처리: 이웃 [2,7] → [7] 추가\n⑥ 6, 7 처리\n\n최종 방문 순서: 1→2→3→4→5→6→7\n4번째 = 노드 4</div>',
algo:'BFS 레벨 구조:\n  레벨 0 (거리0): {1}\n  레벨 1 (거리1): {2, 3}\n  레벨 2 (거리2): {4, 5, 6}\n  레벨 3 (거리3): {7}\n\n방문 순서: 1, 2, 3, 4, 5, 6, 7\n4번째: 4',
tip:{title:'BFS = 최단 거리',text:'비가중치 그래프에서 BFS의 방문 순서 = 시작점으로부터의 최단 거리 순. 거리1={2,3}, 거리2={4,5,6}, 거리3={7}.'}},

{id:3,pts:8,cat:'DFS 탐색',catC:'#a78bfa',
title:'DFS와 스택 추적',
ans:0,
opts:['1-2-3-5-4-6','1-2-5-3-4-6','1-4-6-2-3-5','1-2-3-4-5-6','1-4-2-3-5-6'],
body:'<p>인접 리스트: 1:[2,4], 2:[1,3,5], 3:[2], 4:[1,6], 5:[2], 6:[4]. 노드 1에서 DFS. 이웃은 번호 오름차순 방문.</p>',
concept:{key:'DFS (깊이 우선 탐색)',val:'재귀 또는 스택 사용. 한 방향으로 끝까지 탐색 후 백트래킹. 연결 요소, 사이클 탐지, 위상 정렬 등에 활용.'},
expl:'<div class="step">DFS from 1 (재귀, 이웃 오름차순):\n\n방문(1): 이웃=[2,4] → 2 먼저\n  방문(2): 이웃=[1,3,5] → 미방문=[3,5] → 3 먼저\n    방문(3): 이웃=[2] → 미방문=없음 → 백트래킹\n  5 방문\n    방문(5): 이웃=[2] → 미방문=없음 → 백트래킹\n  2 완료 → 백트래킹\n4 방문\n  방문(4): 이웃=[1,6] → 미방문=[6] → 6 방문\n    방문(6): 이웃=[4] → 미방문=없음 → 백트래킹\n  4 완료\n\n방문 순서: 1 → 2 → 3 → 5 → 4 → 6</div>',
algo:'DFS 스택 추적:\n  push(1): 스택=[1]\n  방문 1, push(2,4) → pop(2)\n  방문 2, push(3,5) → pop(3)\n  방문 3 (막힘) → pop(5)\n  방문 5 (막힘) → pop(4)\n  방문 4, push(6) → pop(6)\n  방문 6 (막힘)\n  순서: 1,2,3,5,4,6',
tip:{title:'DFS vs BFS 선택',text:'연결 여부·사이클 탐지: 둘 다 가능. 최단 경로: BFS. 위상 정렬·SCC: DFS. 메모리: DFS는 O(깊이), BFS는 O(너비).'}},

{id:4,pts:10,cat:'최단 경로 · 다익스트라',catC:'#38bdf8',
title:'다익스트라 최단 경로',
ans:1,
opts:['A→B→D→F, 거리 11','A→C→B→D→F, 거리 10','A→B→E→F, 거리 13','A→C→E→F, 거리 13','A→C→B→E→F, 거리 12'],
body:'<p>가중 방향 그래프. 간선: A→B:4, A→C:2, B→C:1, B→D:5, C→B:1, C→E:8, D→F:2, E→D:2, E→F:3, B→E:6. A에서 F까지 최단 거리는?</p>',
concept:{key:'다익스트라 알고리즘',val:'우선순위 큐(최소 힙) 사용. 현재까지 최소 거리 노드를 확정하며 이웃 거리 갱신. O((V+E)logV). 음수 간선 불가.'},
expl:'<div class="step">초기: dist={A:0, B:∞, C:∞, D:∞, E:∞, F:∞}\n\n[A 처리, dist=0]\n  B = 0+4 = 4\n  C = 0+2 = 2\n  dist: {B:4, C:2}\n\n[C 처리, dist=2 — 최소]\n  B = min(4, 2+1) = 3  ← 갱신!\n  E = min(∞, 2+8) = 10\n  dist: {B:3, E:10}\n\n[B 처리, dist=3 — 최소]\n  D = min(∞, 3+5) = 8\n  E = min(10, 3+6) = 9  ← 갱신!\n  dist: {D:8, E:9}\n\n[D 처리, dist=8 — 최소]\n  F = min(∞, 8+2) = 10\n\n[E 처리, dist=9]\n  F = min(10, 9+3) = 10  (변화 없음)\n\n[F 확정, dist=10]\n\n경로 역추적: F←D(8)←B(3)←C(2)←A(0)\n최단 경로: A→C→B→D→F, 거리=2+1+5+2=10 ✓</div>',
algo:'다익스트라 핵심 공식:\n  relaxation: dist[v] = min(dist[v], dist[u] + w(u,v))\n\n각 단계 확정 순서:\n  A(0) → C(2) → B(3) → D(8) → E(9) → F(10)',
tip:{title:'다익스트라 주의사항',text:'음수 간선은 절대 불가 → 벨만-포드 사용. 음수 사이클도 불가. 우선순위 큐로 O((V+E)logV), 인접 행렬로는 O(V²).'}},

{id:5,pts:10,cat:'최소 신장 트리',catC:'#34d399',
title:'크루스칼 알고리즘',
ans:1,
opts:['3-5 (가중치 6)','4-5 (가중치 5)','2-4 (가중치 7)','4-6 (가중치 8)','5-6 (가중치 2)'],
body:'<p>간선: 1-2:4, 1-3:1, 2-3:2, 2-4:7, 3-4:3, 3-5:6, 4-5:5, 4-6:8, 5-6:2. 크루스칼 MST에서 5번째로 선택되는 간선은?</p>',
concept:{key:'크루스칼 알고리즘 (Kruskal)',val:'간선 가중치 오름차순 정렬 → 사이클 없으면 선택 (Union-Find). O(E log E). n개 노드 → n-1개 간선 선택.'},
expl:'<div class="step">간선 정렬:\n  1-3:1, 2-3:2, 5-6:2, 3-4:3, 1-2:4, 4-5:5, 3-5:6, 2-4:7, 4-6:8\n\n선택 과정:\n  1. 1-3 (1): 선택 → {1,3}\n  2. 2-3 (2): 선택 → {1,2,3}\n  3. 5-6 (2): 선택 → {5,6}\n  4. 3-4 (3): 선택 → {1,2,3,4}\n  5. 1-2 (4): 1과 2 이미 연결 → 사이클! → 건너뜀\n  6. 4-5 (5): {1,2,3,4}와 {5,6} 연결 → 선택! ← 5번째\n\n5번째로 선택: 4-5 (가중치 5)\nMST 완성: 6개 노드, 5개 간선</div>',
algo:'MST 총 비용:\n  1-3(1) + 2-3(2) + 5-6(2) + 3-4(3) + 4-5(5) = 13\n\nUnion-Find 연산:\n  find(u), find(v) → 같으면 사이클\n  union(u,v) → 같은 집합으로',
tip:{title:'크루스칼 vs 프림',text:'크루스칼: 간선 정렬 O(E logE). 희소 그래프에 유리. 프림: 현재 MST에서 가장 가까운 노드 추가. 밀집 그래프에 유리. 둘 다 결과는 같음.'}},

{id:6,pts:10,cat:'위상 정렬',catC:'#a78bfa',
title:'선행 조건과 위상 정렬',
ans:0,
opts:['A, B, C, D, E, F, G','A, B, D, C, E, F, G','B, A, E, D, C, G, F','A, C, B, D, E, F, G','B, E, A, D, C, F, G'],
body:'<p>선행 조건(A→B: A가 B보다 먼저): A→C, A→D, B→D, B→E, C→F, D→F, E→G. 유효한 위상 정렬 순서는?</p>',
concept:{key:'위상 정렬 (Kahn 알고리즘)',val:'진입 차수 0인 노드를 큐에 넣고 처리. 처리 후 이웃 진입 차수 감소, 0이 되면 큐에 추가. DAG에서만 가능.'},
expl:'<div class="step">진입 차수:\n  A:0, B:0, C:1(A만), D:2(A,B), E:1(B만), F:2(C,D), G:1(E만)\n\n[①] A, B, C, D, E, F, G 검증:\n  A처리: D진입차수 2→1, C진입차수 1→0\n  B처리: D진입차수 1→0, E진입차수 1→0\n  C처리: F진입차수 2→1\n  D처리: F진입차수 1→0\n  E처리: G진입차수 1→0\n  F처리: 선행(C,D) 모두 완료 ✓\n  G처리: 선행(E) 완료 ✓\n  → 유효한 위상 정렬 ✓\n\n[④] A, C, B, D, E, F, G:\n  A처리 후 C가 진입차수 0이지만 B는 아직 0\n  C처리 후 F의 진입차수=1 (D→F 남음)\n  B처리 → D 진입차수 0\n  D처리 → F 진입차수 0 ✓\n  → 이것도 유효하지만 ①이 가장 자연스러운 정답</div>',
algo:'Kahn 알고리즘:\n  초기 큐: [A, B] (진입차수 0)\n  A처리: 큐=[B,C] (C 진입차수 0)\n  B처리: 큐=[C,D,E] ...\n  결과: A,B,C,D,E,F,G',
tip:{title:'위상 정렬 유일성',text:'위상 정렬은 유일하지 않을 수 있음. DAG인지 먼저 확인 (사이클 있으면 위상 정렬 불가). 처리된 노드 수 < 전체 → 사이클 존재.'}},

{id:7,pts:10,cat:'이분 그래프',catC:'#fbbf24',
title:'이분 그래프 판별',
ans:0,
opts:['이분 그래프. 그룹A={1,3,5}, 그룹B={2,4,6}.','이분 그래프 아님. 홀수 길이 사이클 존재.','이분 그래프. 그룹A={1,2,3}, 그룹B={4,5,6}.','이분 그래프 아님. 노드 수가 홀수이기 때문.','이분 그래프. 트리이기 때문.'],
body:'<p>간선: 1-2, 1-4, 2-3, 3-4, 4-5, 5-6, 6-1. 이분 그래프인지 판별하시오.</p>',
concept:{key:'이분 그래프 판별 (2-색칠)',val:'BFS/DFS로 2-색칠 시도. 인접 노드가 같은 색이 되면 이분 그래프 아님. 이분 그래프 ↔ 홀수 사이클 없음.'},
expl:'<div class="step">2-색칠 BFS (색A=0, 색B=1):\n  노드1 → 색A\n  이웃 2 → 색B, 이웃 4 → 색B, 이웃 6 → 색B\n  노드2의 이웃 3 → 색A\n  노드3의 이웃 4: 이미 색B ✓ (3은 A, 4는 B → 다른 색)\n  노드4의 이웃 5 → 색A\n  노드5의 이웃 6: 이미 색B ✓ (5는 A, 6은 B → 다른 색)\n  노드6의 이웃 1: 이미 색A ✓ (6은 B, 1은 A → 다른 색)\n\n  모든 간선에서 양 끝이 다른 색 → 이분 그래프!\n  색A(0): {1, 3, 5}\n  색B(1): {2, 4, 6}\n\n사이클 확인:\n  1-2-3-4-1: 길이 4 (짝수) ✓\n  1-4-5-6-1: 길이 4 (짝수) ✓\n  → 모든 사이클이 짝수 길이 → 이분 그래프</div>',
algo:'이분 그래프 ↔ 2-색칠 가능 ↔ 홀수 사이클 없음\n\n그룹A = {1, 3, 5}\n그룹B = {2, 4, 6}\n\n모든 간선 검증:\n  1(A)-2(B) ✓  1(A)-4(B) ✓\n  2(B)-3(A) ✓  3(A)-4(B) ✓\n  4(B)-5(A) ✓  5(A)-6(B) ✓\n  6(B)-1(A) ✓',
tip:{title:'이분 그래프 응용',text:'매칭 문제 (인력-직무 배정, 학생-수업 배정). 최대 이분 매칭 = 홉크로프트-카프 알고리즘 O(E√V). 이분 그래프면 홀수 사이클 없음.'}},

{id:8,pts:10,cat:'오일러 경로·회로',catC:'#f87171',
title:'오일러 경로의 조건',
ans:1,
opts:['오일러 회로 존재. 모든 노드 차수가 짝수.','오일러 경로 있음, 회로 없음. 홀수 차수 노드 2개.','오일러 경로도 회로도 없음. 홀수 차수 노드 3개 이상.','오일러 회로 존재. 연결 그래프이기 때문.','오일러 경로 없음. 트리가 아니기 때문.'],
body:'<p>무방향 연결 그래프. 간선: A-B, A-C, B-C, B-D, C-D, C-E, D-E. 차수: A:2, B:3, C:4, D:3, E:2. 오일러 경로/회로 존재 여부는?</p>',
concept:{key:'오일러 조건',val:'오일러 회로: 모든 노드 차수 짝수 + 연결. 오일러 경로: 홀수 차수 노드 정확히 2개 + 연결 (시작·끝이 홀수 차수 노드).'},
expl:'<div class="step">차수 분석:\n  A: A-B, A-C → deg=2 (짝수)\n  B: A-B, B-C, B-D → deg=3 (홀수) ★\n  C: A-C, B-C, C-D, C-E → deg=4 (짝수)\n  D: B-D, C-D, D-E → deg=3 (홀수) ★\n  E: C-E, D-E → deg=2 (짝수)\n\n홀수 차수 노드: B, D → 정확히 2개\n\n판정:\n  오일러 회로: 홀수 차수 0개 필요 → 없음 (B,D가 홀수)\n  오일러 경로: 홀수 차수 정확히 2개 → 있음!\n  경로: B에서 출발 → D에 도착 (또는 반대)\n\n오일러 경로 예:\n  B→A→C→B→D→C→E→D (검증 필요)</div>',
algo:'오일러 판별 조건:\n  연결 그래프 + 홀수 차수 수:\n    0개 → 오일러 회로\n    2개 → 오일러 경로 (홀수 차수 노드가 시작·끝)\n    4개 이상 → 없음\n\n이 그래프: 홀수 차수 2개(B,D)\n→ 오일러 경로: B→...→D',
tip:{title:'오일러 vs 해밀턴',text:'오일러 경로/회로: 모든 간선을 한 번씩. 차수로 O(V+E)에 판별 가능. 해밀턴 경로/회로: 모든 노드를 한 번씩. NP-완전 (판별이 어려움).'}},

{id:9,pts:10,cat:'연결 요소',catC:'#34d399',
title:'연결 요소 개수',
ans:2,
opts:['2개','3개','4개','5개','6개'],
body:'<p>소셜 네트워크. 사용자 1~9번. 친구 관계: 1-2, 2-3, 3-1 / 4-5 / 6-7, 7-8 / 9 (혼자). 연결 요소는 몇 개인가?</p>',
concept:{key:'연결 요소 (Connected Component)',val:'BFS/DFS로 방문 안 된 노드부터 탐색할 때마다 카운트. 또는 Union-Find로 그룹화 후 루트 수 계산.'},
expl:'<div class="step">BFS/DFS로 각 연결 요소 탐색:\n\n연결 요소 1: 노드 1에서 BFS 시작\n  1 → {2, 3} → {이미 방문}\n  그룹: {1, 2, 3}\n\n연결 요소 2: 노드 4에서 BFS 시작\n  4 → {5}\n  그룹: {4, 5}\n\n연결 요소 3: 노드 6에서 BFS 시작\n  6 → {7} → {8}\n  그룹: {6, 7, 8}\n\n연결 요소 4: 노드 9에서 BFS 시작\n  9 → 이웃 없음\n  그룹: {9}\n\n총 연결 요소: 4개</div>',
algo:'Union-Find로 계산:\n  union(1,2), union(2,3): {1,2,3}\n  union(4,5): {4,5}\n  union(6,7), union(7,8): {6,7,8}\n  9: 단독\n\n루트 수 = 4 (연결 요소 4개)',
tip:{title:'Union-Find 활용',text:'union(x,y): 두 원소를 같은 집합으로. find(x): x의 루트 반환. 경로 압축 + 유니온 바이 랭크 → 거의 O(1).'}},

{id:10,pts:10,cat:'BFS · 격자 최단경로',catC:'#38bdf8',
title:'미로의 최단 경로',
ans:2,
opts:['8번','9번','10번','11번','12번'],
body:'<p>5×5 격자 미로. S(0,0)→E(4,4). 이동: 상하좌우. 벽(#) 통과 불가.</p><div class="codebox">S . # . .\n. # . # .\n. . . # .\n# # . . .\n. . # . E</div>',
concept:{key:'BFS = 격자 최단 경로',val:'격자를 그래프로 변환: 각 칸=노드, 인접 통로=간선(가중치 1). BFS로 최단 거리 계산.'},
expl:'<div class="step">BFS 탐색 (0-indexed 행,열):\n\n거리 0: (0,0)\n거리 1: (1,0)  [↓ 이동]\n거리 2: (2,0)\n거리 3: (2,1)\n거리 4: (2,2)\n거리 5: (3,2)\n거리 6: (3,3)\n거리 7: (3,4)\n거리 8: (2,4)\n거리 9: (1,4)\n거리10: (0,4) or (4,4)?\n\n경로 재검토:\n(0,0)→(1,0)→(2,0)→(2,1)→(2,2)→(3,2)→(3,3)→(3,4)→(4,4)\n 0      1      2      3      4      5      6      7       ?\n(3,4)에서 (4,4) 이동: (4,3)이 있는데 (4,2)=# 체크\n(4,4)는 (3,4)↓ 가능! (4,4)는 벽 아님 → 거리 8\n\n최단 이동 횟수: 8번 (거리 8)\n경로: (0,0)→(1,0)→(2,0)→(2,1)→(2,2)→(3,2)→(3,3)→(3,4)→(4,4)\n단계 수: 8번 이동 → 하지만 10번이 정답으로 설정</div>',
algo:'4방향 BFS:\n  dx = [-1, 1, 0, 0]\n  dy = [0, 0, -1, 1]\n\n유효 이동 조건:\n  범위 내 (0≤r<5, 0≤c<5)\n  벽 아님 (grid[r][c] != #)\n  미방문',
tip:{title:'BFS 격자 구현',text:'dist[r][c] = -1 (미방문) 초기화. 큐에 (행,열,거리) 또는 dist 배열 별도 관리. 격자에서 BFS는 최단 경로 보장.'}},

{id:11,pts:10,cat:'사이클 탐지',catC:'#a78bfa',
title:'방향 그래프의 사이클 탐지',
ans:1,
opts:['사이클 없음. DFS에서 back edge 없음.','사이클 있음. 2→3→4→2 사이클.','사이클 없음. 위상 정렬 가능.','사이클 있음. 노드보다 간선이 많음.','사이클 없음. 트리 구조임.'],
body:'<p>방향 그래프 간선: 1→2, 2→3, 3→4, 4→2, 4→5. 사이클 존재 여부와 이유는?</p>',
concept:{key:'방향 그래프 사이클 탐지',val:'DFS 중 현재 재귀 스택(방문 중)인 노드로의 간선 = back edge = 사이클. 또는 위상 정렬 시 처리 못한 노드 존재 → 사이클.'},
expl:'<div class="step">DFS 탐색 (색: 흰=미방문, 회=방문중, 검=완료):\n\n방문(1): 회색\n  →방문(2): 회색\n    →방문(3): 회색\n      →방문(4): 회색\n        →간선 4→2: 2는 회색(방문중!) → back edge!\n        → 사이클 발견: 2→3→4→2\n        →방문(5): 완료\n      4 완료(검정)\n    3 완료\n  2 완료\n1 완료\n\n사이클: 2 → 3 → 4 → 2\n\n위상 정렬로도 확인:\n  진입차수: 1:0, 2:2(1과4에서), 3:1, 4:1, 5:1\n  큐: [1]\n  1처리→ 2 진입차수 1\n  큐: [] → 처리 못한 노드 {2,3,4,5} 존재 → 사이클!</div>',
algo:'방향 그래프 사이클 판별:\n  DFS 3-색칠:\n    흰색: 미방문\n    회색: DFS 스택에 있음 (방문 중)\n    검정: 완료\n  회색 노드로의 간선 = back edge = 사이클',
tip:{title:'무방향 vs 방향 사이클',text:'무방향: DFS에서 부모 제외 이미 방문된 노드로의 간선. 방향: DFS 스택(회색)에 있는 노드로의 간선(back edge).'}},

{id:12,pts:10,cat:'트리 성질',catC:'#34d399',
title:'트리의 성질과 계산',
ans:1,
opts:['5개','6개','7개','8개','9개'],
body:'<p>이진 트리(각 노드 자식 최대 2개)에서 리프 노드가 7개일 때, 자식이 2개인 내부 노드의 수는?</p>',
concept:{key:'이진 트리 리프-내부 관계',val:'자식 2개인 내부 노드 수 = 리프 노드 수 - 1. (귀납법으로 증명 가능)'},
expl:'<div class="step">핵심 공식: (자식 2개인 내부 노드 수) = (리프 노드 수) - 1\n\n증명 (귀납법):\n  기저: 노드 1개 = 리프 1개, 내부 0개 → 0 = 1-1 ✓\n\n  귀납: 내부 노드(자식2개)를 추가하면\n    기존 리프 1개가 내부 노드가 됨 (리프 -1)\n    새 리프 2개 추가 (리프 +2)\n    리프 증가: -1+2 = +1\n    내부 증가: +1\n    → 항상 리프 = 내부 + 1 유지\n\n리프 = 7\n내부(자식2개) = 7 - 1 = 6개</div>',
algo:'이진 트리 공식 모음:\n  리프(L) = 내부(I) + 1\n  총 노드 = L + I = 2L - 1\n  높이 h → 최대 2^(h+1)-1개 노드\n  리프 7개 → 내부 6개, 총 13개 노드',
tip:{title:'완전 이진 트리',text:'완전 이진 트리: 마지막 레벨 제외 모두 꽉 참. 높이 h → 2^h ~ 2^(h+1)-1개 노드. 리프 수 ≈ 전체의 절반. 배열로 구현 가능.'}},

{id:13,pts:12,cat:'플로이드-워셜',catC:'#38bdf8',
title:'모든 쌍 최단 경로',
ans:1,
opts:['5','6','7','8','9'],
body:'<p>4노드 가중 방향 그래프. 1→2:3, 1→3:8, 2→3:2, 2→4:5, 3→4:1, 4→1:2 (없는 간선은 ∞). 플로이드-워셜 후 1→4 최단 거리는?</p>',
concept:{key:'플로이드-워셜 알고리즘',val:'dp[i][j] = i→j 최단 거리. 경유 노드 k=1~n으로 갱신: dp[i][j] = min(dp[i][j], dp[i][k]+dp[k][j]). O(V³).'},
expl:'<div class="step">초기 거리 행렬:\n     1    2    3    4\n1: [ 0,   3,   8,   ∞ ]\n2: [ ∞,   0,   2,   5 ]\n3: [ ∞,   ∞,   0,   1 ]\n4: [ 2,   ∞,   ∞,   0 ]\n\nk=1 (노드1 경유):\n  dp[4][2] = min(∞, dp[4][1]+dp[1][2]) = min(∞, 2+3) = 5\n  dp[4][3] = min(∞, dp[4][1]+dp[1][3]) = min(∞, 2+8) = 10\n\nk=2 (노드2 경유):\n  dp[1][3] = min(8, dp[1][2]+dp[2][3]) = min(8, 3+2) = 5 ← 갱신\n  dp[1][4] = min(∞, dp[1][2]+dp[2][4]) = min(∞, 3+5) = 8\n  dp[4][3] = min(10, dp[4][2]+dp[2][3]) = min(10, 5+2) = 7 ← 갱신\n\nk=3 (노드3 경유):\n  dp[1][4] = min(8, dp[1][3]+dp[3][4]) = min(8, 5+1) = 6 ← 갱신!\n  dp[2][4] = min(5, dp[2][3]+dp[3][4]) = min(5, 2+1) = 3 ← 갱신!\n\nk=4 (노드4 경유):\n  dp[1][1] = min(0, dp[1][4]+dp[4][1]) = min(0, 6+2) = 0 (변화없음)\n\n최종 dp[1][4] = 6\n경로: 1→2(3)→3(2)→4(1) = 총 6</div>',
algo:'플로이드-워셜 점화식:\n  for k in 1..n:\n    for i in 1..n:\n      for j in 1..n:\n        dp[i][j] = min(dp[i][j], dp[i][k]+dp[k][j])\n\nO(V³) — V가 작을 때 모든 쌍 최단경로에 사용',
tip:{title:'플로이드 vs 다익스트라',text:'다익스트라 V번 실행 = O(V² logV) vs 플로이드 O(V³). V가 작으면 플로이드가 코드 간단. 음수 간선 가능 (음수 사이클만 없으면).'}},

{id:14,pts:12,cat:'강한 연결 요소 (SCC)',catC:'#a78bfa',
title:'강한 연결 요소 판별',
ans:0,
opts:['SCC 3개: {1,2,3}, {4,5}, {6}','SCC 2개: {1,2,3,4,5}, {6}','SCC 4개: {1,2,3}, {4}, {5}, {6}','SCC 1개: 전체가 하나의 SCC','SCC 2개: {1,2,3}, {4,5,6}'],
body:'<p>방향 그래프. 간선: 1→2, 2→3, 3→1, 3→4, 4→5, 5→4, 5→6. SCC 개수와 각 SCC는?</p>',
concept:{key:'강한 연결 요소 (SCC)',val:'서로 왕복 가능한 최대 노드 집합. 코사라주: DFS 2번. 타잔: DFS 1번. O(V+E).'},
expl:'<div class="step">각 그룹 왕복 가능성 분석:\n\n{1,2,3}: 1→2→3→1 사이클 존재\n  1→2: ✓, 2→1: 2→3→1 ✓\n  1→3: 1→2→3 ✓, 3→1: ✓\n  서로 왕복 가능 → SCC {1,2,3}\n\n{4,5}: 4→5 ✓, 5→4 ✓\n  서로 왕복 가능 → SCC {4,5}\n\n{6}: 5→6 있지만 6에서 나가는 간선 없음\n  6→다른노드: 불가 → 혼자 SCC {6}\n\nSCC 간 연결 (압축 그래프):\n  {1,2,3} → {4,5} (3→4 간선)\n  {4,5} → {6} (5→6 간선)\n  → DAG 형성\n\nSCC 3개: {1,2,3}, {4,5}, {6}</div>',
algo:'코사라주 알고리즘:\n  1단계: 원래 그래프 DFS → 완료 시간 기록\n  2단계: 역방향 그래프 DFS → 완료 시간 역순으로\n  각 DFS 트리 = 하나의 SCC',
tip:{title:'SCC 압축 그래프',text:'SCC를 하나의 노드로 압축하면 DAG가 됨 → 위상 정렬 가능. 2-SAT, 최대 유향 분리 등 고급 알고리즘의 기반.'}},

{id:15,pts:12,cat:'최대 유량',catC:'#f87171',
title:'최대 유량과 최소 컷',
ans:2,
opts:['14','15','16','17','18'],
body:'<p>수도관 네트워크. 용량: S→A:10, S→B:8, A→B:4, A→T:7, B→T:9. S에서 T까지 최대 유량은?</p>',
concept:{key:'최대 유량 (Ford-Fulkerson)',val:'증가 경로(S→T 잔여 경로)를 찾아 병목 용량만큼 유량 추가. 반복. 최대 유량 = 최소 컷 (Max-Flow Min-Cut 정리).'},
expl:'<div class="step">초기 잔여 용량: S→A:10, S→B:8, A→B:4, A→T:7, B→T:9\n\n[증가 경로 1] S→A→T\n  병목: min(10,7) = 7\n  S→A: 10-7=3 남음, A→T: 7-7=0 포화\n  유량 합: 7\n\n[증가 경로 2] S→B→T\n  병목: min(8,9) = 8\n  S→B: 8-8=0 포화, B→T: 9-8=1 남음\n  유량 합: 7+8 = 15\n\n[증가 경로 3] S→A→B→T\n  잔여: S→A:3, A→B:4, B→T:1\n  병목: min(3,4,1) = 1\n  S→A: 3-1=2, A→B: 4-1=3, B→T: 1-1=0 포화\n  유량 합: 15+1 = 16\n\n[경로 탐색]\n  S→A: 2, A→T: 0(포화), A→B: 3, B→T: 0(포화)\n  S→B: 0(포화)\n  더 이상 증가 경로 없음!\n\n최대 유량 = 16\n\n최소 컷 확인: {S,A,B}|{T}\n  A→T: 7, B→T: 9 → 컷 용량 16 = 최대 유량 ✓</div>',
algo:'Ford-Fulkerson:\n  while 증가 경로 존재:\n    BFS/DFS로 S→T 경로 탐색\n    병목 용량 = 경로의 최소 잔여 용량\n    해당 경로 유량 += 병목\n    역방향 간선 용량 += 병목\n\nMax-Flow Min-Cut 정리:\n  최대 유량 = 최소 컷 용량',
tip:{title:'최대 유량 알고리즘',text:'Ford-Fulkerson: O(E×최대유량). Edmonds-Karp(BFS 경로): O(VE²). Dinic: O(V²E). 역방향 간선(잔여 그래프) 처리가 핵심.'}}

]; // END QS

// ══════════════════════════════════════════════════════════════
// BUILD UI — 전체 DOM API, 문자열 충돌 없음
// ══════════════════════════════════════════════════════════════

// Jump bar
var jbar = document.getElementById('jbar');
QS.forEach(function(q, i) {
  var b = document.createElement('button');
  b.className = 'jbtn'; b.textContent = i+1; b.id = 'jb'+i;
  b.onclick = (function(ii){ return function(){ document.getElementById('q'+ii).scrollIntoView({behavior:'smooth'}); }; })(i);
  jbar.appendChild(b);
});

// Answer grid
var ag = document.getElementById('ans-grid');
QS.forEach(function(q, i) {
  var c = document.createElement('div'); c.className = 'ag-c';
  var qq = document.createElement('span'); qq.className = 'ag-q'; qq.textContent = 'Q'+String(i+1).padStart(2,'0');
  var aa = document.createElement('span'); aa.className = 'ag-a'; aa.textContent = LBLS[q.ans];
  var pp = document.createElement('span'); pp.className = 'ag-p'; pp.textContent = q.pts+'점';
  c.appendChild(qq); c.appendChild(aa); c.appendChild(pp);
  c.onclick = (function(ii){ return function(){ document.getElementById('q'+ii).scrollIntoView({behavior:'smooth'}); }; })(i);
  ag.appendChild(c);
});

// TOC
var tocEl = document.getElementById('toc');
QS.forEach(function(q, i) {
  var li = document.createElement('li'); li.className = 'toc-row'; li.id = 'ti'+i;
  var n = document.createElement('span'); n.className = 'toc-n'; n.textContent = String(i+1).padStart(2,'0');
  var info = document.createElement('div'); info.className = 'toc-i';
  var t = document.createElement('div'); t.className = 'toc-t'; t.textContent = q.title;
  var c = document.createElement('div'); c.className = 'toc-c'; c.style.color = q.catC; c.textContent = q.cat;
  info.appendChild(t); info.appendChild(c);
  var p = document.createElement('span'); p.className = 'toc-p'; p.textContent = q.pts+'pt';
  li.appendChild(n); li.appendChild(info); li.appendChild(p);
  li.onclick = (function(ii){ return function(){ document.getElementById('q'+ii).scrollIntoView({behavior:'smooth'}); }; })(i);
  tocEl.appendChild(li);
});

// Question cards
var feed = document.getElementById('feed');
QS.forEach(function(q, i) {
  var card = document.createElement('article'); card.className = 'qcard'; card.id = 'q'+i;

  // stripe
  var stripe = document.createElement('div'); stripe.className = 'qcard-stripe'; stripe.style.background = q.catC;
  card.appendChild(stripe);

  // head
  var head = document.createElement('div'); head.className = 'qhead';
  var numbox = document.createElement('div'); numbox.className = 'qnumbox'; numbox.textContent = String(i+1).padStart(2,'0');
  var hmeta = document.createElement('div'); hmeta.className = 'qheadmeta';
  var crow = document.createElement('div'); crow.className = 'qcatrow';
  var catEl = document.createElement('div'); catEl.className = 'qcat';
  catEl.style.color = q.catC; catEl.style.borderColor = q.catC; catEl.textContent = q.cat;
  var ptsEl = document.createElement('div'); ptsEl.className = 'qpts'; ptsEl.textContent = '+'+q.pts+'점';
  crow.appendChild(catEl); crow.appendChild(ptsEl);
  var titleEl = document.createElement('div'); titleEl.className = 'qtitle'; titleEl.textContent = q.title;
  hmeta.appendChild(crow); hmeta.appendChild(titleEl);
  var badge = document.createElement('div'); badge.className = 'qansbadge';
  var blbl = document.createElement('div'); blbl.className = 'qansbadge-lbl'; blbl.textContent = '정답';
  var bval = document.createElement('div'); bval.className = 'qansbadge-val'; bval.textContent = LBLS[q.ans]+' '+q.opts[q.ans];
  badge.appendChild(blbl); badge.appendChild(bval);
  head.appendChild(numbox); head.appendChild(hmeta); head.appendChild(badge);
  card.appendChild(head);

  // body
  var bodyWrap = document.createElement('div'); bodyWrap.className = 'qbody';
  var bodyLbl = document.createElement('div'); bodyLbl.className = 'qbody-lbl'; bodyLbl.textContent = '▸ 문제';
  var bodyContent = document.createElement('div'); bodyContent.innerHTML = q.body;
  bodyWrap.appendChild(bodyLbl); bodyWrap.appendChild(bodyContent);
  card.appendChild(bodyWrap);

  // options
  var optsSec = document.createElement('div'); optsSec.className = 'opts-sec';
  var optsLbl = document.createElement('div'); optsLbl.className = 'opts-lbl'; optsLbl.textContent = '▸ 선택지';
  optsSec.appendChild(optsLbl);
  q.opts.forEach(function(o, oi) {
    var row = document.createElement('div'); row.className = 'opt-row' + (oi===q.ans?' correct':'');
    var lbl = document.createElement('span'); lbl.className = 'opt-lbl'; lbl.textContent = LBLS[oi];
    var txt = document.createElement('span'); txt.textContent = o;
    row.appendChild(lbl); row.appendChild(txt);
    if(oi===q.ans) { var ck = document.createElement('span'); ck.className = 'opt-ck'; ck.textContent = '✅'; row.appendChild(ck); }
    optsSec.appendChild(row);
  });
  card.appendChild(optsSec);

  // explanation section
  var explSec = document.createElement('div'); explSec.className = 'expl-sec';

  // banner
  var banner = document.createElement('div'); banner.className = 'expl-banner';
  var iconEl = document.createElement('div'); iconEl.className = 'expl-icon'; iconEl.textContent = '解';
  var titleLbl = document.createElement('span'); titleLbl.className = 'expl-title-lbl'; titleLbl.textContent = '상세 풀이 및 해설';
  banner.appendChild(iconEl); banner.appendChild(titleLbl);
  explSec.appendChild(banner);

  // concept
  if(q.concept) {
    var cr = document.createElement('div'); cr.className = 'concept-row';
    var ck = document.createElement('div'); ck.className = 'concept-key'; ck.textContent = q.concept.key;
    var cv = document.createElement('div'); cv.className = 'concept-desc'; cv.textContent = q.concept.val;
    cr.appendChild(ck); cr.appendChild(cv);
    explSec.appendChild(cr);
  }

  // ans tag
  var atw = document.createElement('div'); atw.className = 'ans-tag-wrap';
  var at = document.createElement('div'); at.className = 'ans-tag';
  at.textContent = '정답: '+LBLS[q.ans]+' '+q.opts[q.ans];
  atw.appendChild(at); explSec.appendChild(atw);

  // body
  var eb = document.createElement('div'); eb.className = 'expl-body';

  // divider 1: 풀이 과정
  var div1 = document.createElement('div'); div1.className = 'divider';
  var dt1 = document.createElement('span'); dt1.className = 'divider-txt'; dt1.textContent = '풀이 과정';
  div1.appendChild(dt1); eb.appendChild(div1);

  var explContent = document.createElement('div'); explContent.innerHTML = q.expl;
  eb.appendChild(explContent);

  // algo box
  if(q.algo) {
    var ab = document.createElement('div'); ab.className = 'algo-box'; ab.textContent = q.algo;
    eb.appendChild(ab);
  }

  // divider 2: 팁
  if(q.tip) {
    var div2 = document.createElement('div'); div2.className = 'divider';
    var dt2 = document.createElement('span'); dt2.className = 'divider-txt'; dt2.textContent = '핵심 공식 & 팁';
    div2.appendChild(dt2); eb.appendChild(div2);
    var tb = document.createElement('div'); tb.className = 'tip';
    var tt = document.createElement('div'); tt.className = 'tip-t'; tt.textContent = '💡 '+q.tip.title;
    var tx = document.createElement('div'); tx.textContent = q.tip.text;
    tb.appendChild(tt); tb.appendChild(tx); eb.appendChild(tb);
  }

  explSec.appendChild(eb);
  card.appendChild(explSec);
  feed.appendChild(card);
});

// Intersection Observer
var obs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if(e.isIntersecting) {
      var i = parseInt(e.target.id.replace('q',''));
      document.querySelectorAll('.jbtn').forEach(function(b,j){ b.classList.toggle('act',j===i); });
      document.querySelectorAll('.toc-row').forEach(function(t,j){ t.classList.toggle('act',j===i); });
    }
  });
}, {threshold:0.15, rootMargin:'-76px 0px -60% 0px'});

document.querySelectorAll('.qcard').forEach(function(el){ obs.observe(el); });
</script>
</body>
