<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOI 중등 경우의 수 — 15문제 완전 해설</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');

/* ── TOKENS ── */
:root {
  --void: #09090f;
  --deep: #12121e;
  --surface: #1a1a2e;
  --lift: #22223a;
  --ridge: #2e2e50;
  --line: #3a3a60;
  --faint: #555580;
  --muted: #8888aa;
  --text: #e8e8f4;
  --bright: #f4f4ff;

  --gold: #e8c547;
  --gold2: #f5d76e;
  --rose: #e85d75;
  --mint: #4ecdc4;
  --sky: #7eb8f7;
  --lavender: #b39ddb;

  --ok-bg: rgba(78,205,196,.1);
  --ok-br: #4ecdc4;
  --ng-bg: rgba(232,93,117,.1);
  --ng-br: #e85d75;
  --sel-bg: rgba(232,197,71,.08);
  --sel-br: #e8c547;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background: var(--void);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* subtle grid */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(232,197,71,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,197,71,.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events:none; z-index:0;
}

/* ══════════════════════════════════
   SPLASH
══════════════════════════════════ */
#splash {
  position:fixed; inset:0; z-index:500;
  background: var(--void);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  transition: opacity .8s, visibility .8s;
}
#splash.out { opacity:0; visibility:hidden; }

.sp-wrap {
  max-width:640px; width:92%;
  display:flex; flex-direction:column; align-items:center; gap:0;
  text-align:center;
}

.sp-ornament {
  font-size:11px; letter-spacing:6px;
  color: var(--faint); text-transform:uppercase;
  font-family:'DM Mono', monospace;
  margin-bottom:32px;
}

.sp-title {
  font-family:'Playfair Display', serif;
  font-size: clamp(52px, 10vw, 100px);
  font-weight:900; line-height:.92;
  color: var(--bright);
  letter-spacing:-2px;
  margin-bottom:8px;
}
.sp-title .gold { color: var(--gold); }

.sp-subtitle {
  font-family:'Playfair Display', serif;
  font-size: clamp(16px, 3vw, 24px);
  font-style:italic; color: var(--muted);
  margin-bottom:48px;
}

.sp-divider {
  width:100%; height:1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  margin-bottom:40px;
}

.sp-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:1px; background:var(--line);
  width:100%; margin-bottom:40px;
}
.sp-cell {
  background: var(--deep);
  padding:20px 12px; text-align:center;
}
.sp-cell-n {
  font-family:'Playfair Display', serif;
  font-size:36px; font-weight:700;
  color: var(--gold); display:block; line-height:1;
}
.sp-cell-l {
  font-size:11px; color:var(--muted);
  letter-spacing:2px; margin-top:4px;
}

.sp-desc {
  font-size:13.5px; color:var(--muted); line-height:1.85;
  margin-bottom:40px; max-width:480px;
}
.sp-desc strong { color:var(--text); }

.sp-btn {
  position:relative; overflow:hidden;
  padding:16px 60px;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:'Playfair Display', serif;
  font-size:17px; font-weight:700;
  cursor:pointer; letter-spacing:2px;
  transition: color .3s;
}
.sp-btn::before {
  content:'';
  position:absolute; inset:0;
  background:var(--gold);
  transform:translateX(-100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.sp-btn:hover::before { transform:translateX(0); }
.sp-btn:hover { color:var(--void); }
.sp-btn span { position:relative; z-index:1; }

/* ══════════════════════════════════
   HEADER
══════════════════════════════════ */
#hdr {
  display:none;
  position:sticky; top:0; z-index:100;
  background:rgba(9,9,15,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.hdr-inner {
  max-width:1080px; margin:0 auto;
  padding:10px 24px;
  display:flex; align-items:center;
  justify-content:space-between; gap:12px;
}
.hdr-brand {
  font-family:'Playfair Display', serif;
  font-size:16px; font-weight:700; color:var(--bright);
}
.hdr-brand em { color:var(--gold); font-style:italic; }

/* q-nav dots */
.qnav {
  display:flex; gap:5px; flex-wrap:wrap;
  max-width:460px;
}
.qdot {
  width:10px; height:10px;
  border-radius:50%;
  background:var(--ridge);
  cursor:pointer; transition:all .2s;
  border:1px solid transparent;
}
.qdot:hover { background:var(--faint); }
.qdot.answered { background:var(--lavender); }
.qdot.cur { background:var(--gold); transform:scale(1.5); border-color:var(--gold2); }
.qdot.ok { background:var(--mint); }
.qdot.ng { background:var(--rose); }

.hdr-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
#tmr {
  font-family:'DM Mono', monospace;
  font-size:22px; font-weight:500; color:var(--bright);
}
#tmr.warn { color:var(--rose); animation:blink .8s step-end infinite; }
@keyframes blink { 50%{opacity:.25} }
#hpts {
  font-family:'DM Mono', monospace;
  font-size:10px; color:var(--faint);
}

#pbar { display:none; height:3px; background:var(--ridge); }
#pfill {
  height:100%;
  background:linear-gradient(90deg, var(--gold), var(--rose));
  transition:width .4s;
}

/* ══════════════════════════════════
   APP
══════════════════════════════════ */
#app {
  display:none; position:relative; z-index:1;
  max-width:860px; margin:0 auto;
  padding:44px 24px 160px;
}

/* ── QUESTION CARD ── */
.qcard { display:none; animation:rise .35s ease; }
.qcard.on { display:block; }
@keyframes rise {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* number stamp */
.q-stamp {
  display:flex; align-items:flex-end; gap:16px;
  margin-bottom:12px;
}
.q-stamp-num {
  font-family:'Playfair Display', serif;
  font-size:88px; font-weight:900; line-height:1;
  color:var(--ridge); letter-spacing:-4px;
  user-select:none;
}
.q-stamp-meta { padding-bottom:10px; }
.q-stamp-cat {
  font-family:'DM Mono', monospace;
  font-size:10px; letter-spacing:3px;
  text-transform:uppercase; margin-bottom:4px;
}
.q-stamp-title {
  font-family:'Playfair Display', serif;
  font-size:22px; font-weight:700; color:var(--bright);
  line-height:1.3;
}
.q-stamp-pts {
  font-family:'DM Mono', monospace;
  font-size:12px; color:var(--gold);
  margin-top:4px;
}

/* question body */
.q-body {
  background:var(--surface);
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  padding:26px 30px;
  margin-bottom:18px;
  font-size:15px; line-height:2.05;
  color: #ccccee;
  position:relative;
}
.q-body::after {
  content:'';
  position:absolute; top:0; right:0;
  width:80px; height:80px;
  background:radial-gradient(circle at top right, rgba(232,197,71,.06), transparent 70%);
}
.q-body p { margin-bottom:12px; }
.q-body p:last-child { margin-bottom:0; }
.q-body strong { color:var(--gold2); }
.q-body em { color:var(--rose); font-style:normal; font-weight:700; }
.q-body ul, .q-body ol { margin:10px 0 10px 28px; line-height:2.3; }

/* scenario box */
.sbox {
  background:rgba(255,255,255,.03);
  border:1px solid var(--ridge);
  border-left:3px solid var(--lavender);
  padding:16px 20px; margin:14px 0;
  font-size:14px; line-height:2;
}
.sbox-title {
  font-family:'DM Mono', monospace;
  font-size:9px; letter-spacing:3px; text-transform:uppercase;
  color:var(--lavender); margin-bottom:8px; font-weight:500;
}

/* code/formula block */
.fbox {
  font-family:'DM Mono', monospace;
  background:rgba(0,0,0,.4);
  border:1px solid var(--ridge);
  border-left:3px solid var(--mint);
  padding:14px 18px; margin:12px 0;
  font-size:13px; line-height:1.9;
  overflow-x:auto; white-space:pre;
  color: var(--mint);
}

/* table */
.tbl-wrap { margin:12px 0; overflow-x:auto; }
.qtbl { border-collapse:collapse; font-size:13.5px; min-width:300px; }
.qtbl th {
  background:var(--lift); border:1px solid var(--line);
  padding:8px 16px; color:var(--muted);
  font-family:'DM Mono', monospace; font-size:11px;
  letter-spacing:1px; text-align:center;
}
.qtbl td {
  border:1px solid var(--ridge); padding:8px 16px;
  text-align:center; color:var(--text);
}
.qtbl td.hi { color:var(--gold2); font-weight:700; }

/* ── OPTIONS ── */
.opts { display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }

.opt {
  display:flex; align-items:flex-start; gap:14px;
  padding:13px 18px;
  background:var(--surface);
  border:1px solid var(--ridge);
  cursor:pointer; font-size:14px; line-height:1.75;
  color:var(--text); text-align:left; width:100%;
  transition:all .18s; position:relative; overflow:hidden;
}
.opt::before {
  content:''; position:absolute; inset:0;
  background:var(--gold);
  opacity:0; transition:opacity .18s;
}
.opt:hover { border-color:var(--gold); }
.opt:hover::before { opacity:.04; }
.opt.sel { border-color:var(--sel-br); background:var(--sel-bg); }
.opt.ok  { border-color:var(--ok-br);  background:var(--ok-bg); }
.opt.ng  { border-color:var(--ng-br);  background:var(--ng-bg); }
.opt.off { pointer-events:none; }

.opt-lbl {
  font-family:'DM Mono', monospace;
  font-size:13px; font-weight:500;
  color:var(--faint); min-width:22px;
  flex-shrink:0; padding-top:1px;
  position:relative; z-index:1;
}
.opt.sel .opt-lbl { color:var(--gold); }
.opt.ok  .opt-lbl { color:var(--mint); }
.opt.ng  .opt-lbl { color:var(--rose); }
.opt-txt { position:relative; z-index:1; }
.opt-check { margin-left:auto; font-size:16px; flex-shrink:0; position:relative; z-index:1; }

/* ── EXPLANATION ── */
.expl {
  display:none; margin-bottom:22px;
  border:1px solid var(--line);
  animation:fadein .4s ease;
}
.expl.on { display:block; }
@keyframes fadein { from{opacity:0}to{opacity:1} }

.expl-banner {
  background:var(--lift);
  border-bottom:1px solid var(--line);
  padding:12px 22px;
  display:flex; align-items:center; gap:12px;
}
.expl-banner-icon {
  width:30px; height:30px;
  border:1px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0;
  color:var(--gold);
  font-family:'Playfair Display', serif;
  font-style:italic;
}
.expl-banner-title {
  font-family:'DM Mono', monospace;
  font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted);
}
.verdict-ok { margin-left:auto; color:var(--mint); font-weight:700; font-size:13px; }
.verdict-ng { margin-left:auto; color:var(--rose); font-weight:700; font-size:13px; }

/* concept tag */
.concept-strip {
  background:rgba(179,157,219,.07);
  border-bottom:1px solid var(--line);
  padding:10px 22px;
  display:flex; align-items:flex-start; gap:10px;
}
.concept-key {
  font-family:'DM Mono', monospace;
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--lavender); border:1px solid var(--lavender);
  padding:2px 10px; white-space:nowrap; flex-shrink:0; margin-top:2px;
}
.concept-val { font-size:13px; color:var(--muted); line-height:1.75; }

.ans-tag {
  margin:0 22px 0;
  display:inline-block;
  background:rgba(78,205,196,.12);
  border:1px solid var(--mint);
  color:var(--mint);
  font-family:'DM Mono', monospace;
  font-size:12px; padding:5px 16px; margin-top:18px;
  font-weight:500;
}

.expl-body {
  padding:20px 22px 24px;
  font-size:14px; line-height:2;
  color:var(--muted);
}
.expl-body p { margin-bottom:10px; }
.expl-body p:last-child { margin-bottom:0; }
.expl-body strong { color:var(--sky); }

/* step box */
.step {
  font-family:'DM Mono', monospace;
  background:rgba(0,0,0,.5);
  border:1px solid var(--ridge);
  border-left:3px solid var(--lavender);
  padding:16px 20px; margin:12px 0;
  font-size:12.5px; line-height:1.95;
  white-space:pre-wrap; overflow-x:auto;
  color: #c0c0e0;
}

/* tip */
.tip {
  background:rgba(232,197,71,.06);
  border-left:3px solid var(--gold);
  padding:12px 16px; margin:12px 0;
  font-size:13px; line-height:1.75;
  color:var(--muted);
}
.tip-title {
  font-family:'DM Mono', monospace;
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--gold); margin-bottom:4px; font-weight:500;
}

/* ── NAV ── */
.nav-row {
  display:flex; align-items:center;
  justify-content:space-between; gap:10px;
}
.nbtn {
  padding:11px 24px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  font-family:'Noto Sans KR', sans-serif;
  font-size:13px; cursor:pointer; transition:all .2s;
}
.nbtn:hover { border-color:var(--text); color:var(--text); }
.nbtn:disabled { opacity:.25; cursor:not-allowed; }
.nbtn-sub {
  background:var(--gold);
  border-color:var(--gold);
  color:var(--void); font-weight:700;
}
.nbtn-sub:hover { background:var(--gold2); border-color:var(--gold2); color:var(--void); }
.nbtn-sub:disabled { opacity:.3; }
.nbtn-end {
  background:var(--mint);
  border-color:var(--mint);
  color:var(--void); font-weight:700;
}
.nbtn-end:hover { background:#6eded7; border-color:#6eded7; }

/* ══════════════════════════════════
   RESULT
══════════════════════════════════ */
#result {
  display:none; position:fixed; inset:0; z-index:200;
  background:var(--void); overflow-y:auto;
  animation:rise .5s ease;
}
#result.on { display:block; }

.res-wrap {
  max-width:720px; margin:0 auto;
  padding:72px 24px 120px;
}

.res-hero { text-align:center; margin-bottom:56px; }

.res-eyebrow {
  font-family:'DM Mono', monospace;
  font-size:10px; letter-spacing:5px; text-transform:uppercase;
  color:var(--faint); margin-bottom:20px;
}

.res-score-wrap {
  position:relative; width:180px; height:180px;
  margin:0 auto 24px;
}
.res-score-wrap svg {
  position:absolute; inset:0;
  transform:rotate(-90deg);
}
.res-score-inner {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.res-score-n {
  font-family:'Playfair Display', serif;
  font-size:52px; font-weight:900; color:var(--gold); line-height:1;
}
.res-score-d {
  font-family:'DM Mono', monospace;
  font-size:12px; color:var(--faint);
}
.res-grade {
  font-family:'Playfair Display', serif;
  font-size:24px; font-weight:700; font-style:italic;
}

.res-stats {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:1px; background:var(--line);
  border:1px solid var(--line);
  margin-bottom:48px;
}
.res-stat {
  background:var(--deep); padding:20px 12px; text-align:center;
}
.res-stat-n {
  font-family:'Playfair Display', serif;
  font-size:34px; font-weight:700; display:block; line-height:1;
}
.res-stat-l { font-size:11px; color:var(--faint); margin-top:4px; letter-spacing:1px; }

.rev-title {
  font-family:'DM Mono', monospace;
  font-size:10px; letter-spacing:3px; text-transform:uppercase;
  color:var(--faint);
  border-top:1px solid var(--line);
  padding-top:16px; margin-bottom:14px;
}
.rev-list { display:flex; flex-direction:column; gap:6px; margin-bottom:48px; }
.rev-row {
  display:flex; align-items:flex-start; gap:12px;
  background:var(--surface); border:1px solid var(--ridge);
  padding:12px 16px; cursor:pointer; transition:border-color .18s;
}
.rev-row:hover { border-color:var(--gold); }
.rev-row.ok { border-left:3px solid var(--mint); }
.rev-row.ng { border-left:3px solid var(--rose); }
.rev-row-n {
  font-family:'DM Mono', monospace;
  font-size:10px; color:var(--faint);
  min-width:54px; flex-shrink:0; line-height:1.5;
}
.rev-row-t { font-size:13px; flex:1; line-height:1.5; }
.rev-row-m { font-size:18px; flex-shrink:0; }

.btn-restart {
  display:block; width:100%; padding:18px;
  background:var(--gold); border:none;
  color:var(--void);
  font-family:'Playfair Display', serif;
  font-size:17px; font-weight:700;
  cursor:pointer; letter-spacing:1px;
  transition:background .2s;
}
.btn-restart:hover { background:var(--gold2); }

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .hdr-dots { display:none; }
  .res-stats { grid-template-columns:1fr 1fr; }
  .q-body, .expl-body { padding:18px; }
  .q-stamp-num { font-size:60px; }
}
</style>
</head>
<body>

<!-- ══ SPLASH ══ -->
<div id="splash">
  <div class="sp-wrap">
    <div class="sp-ornament">Korea Informatics Olympiad · 중등부 심화</div>
    <div class="sp-title">경우의<br><span class="gold">수</span></div>
    <div class="sp-subtitle">Combinatorics Practice · 15 Problems</div>
    <div class="sp-divider"></div>
    <div class="sp-grid">
      <div class="sp-cell"><span class="sp-cell-n">15</span><span class="sp-cell-l">총 문항</span></div>
      <div class="sp-cell"><span class="sp-cell-n">150</span><span class="sp-cell-l">총 배점</span></div>
      <div class="sp-cell"><span class="sp-cell-n">60</span><span class="sp-cell-l">제한(분)</span></div>
    </div>
    <p class="sp-desc">
      KOI 중등부 기출 수준의 <strong>경우의 수</strong> 전문 문제집입니다.<br>
      순열·조합·중복·비인접·원형·파스칼 등 핵심 유형 15문제와<br>
      단계별 풀이 과정이 제출 후 즉시 공개됩니다.
    </p>
    <button class="sp-btn" onclick="startExam()"><span>▶ 풀기 시작</span></button>
  </div>
</div>

<!-- ══ HEADER ══ -->
<header id="hdr">
  <div class="hdr-inner">
    <div class="hdr-brand">경우의 <em>수</em> 특강</div>
    <div class="qnav" id="qnav"></div>
    <div class="hdr-right">
      <div id="tmr">60:00</div>
      <div id="hpts">0 / 150점</div>
    </div>
  </div>
</header>
<div id="pbar"><div id="pfill"></div></div>

<!-- ══ APP ══ -->
<div id="app"></div>

<!-- ══ RESULT ══ -->
<div id="result">
  <div class="res-wrap">
    <div class="res-hero">
      <div class="res-eyebrow">최종 결과 · Combinatorics</div>
      <div class="res-score-wrap">
        <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="90" cy="90" r="78" stroke="#2e2e50" stroke-width="8"/>
          <circle id="arc" cx="90" cy="90" r="78"
            stroke="#e8c547" stroke-width="8"
            stroke-dasharray="490" stroke-dashoffset="490"
            stroke-linecap="round"
            style="transition:stroke-dashoffset 1.2s ease"/>
        </svg>
        <div class="res-score-inner">
          <div class="res-score-n" id="rscore">0</div>
          <div class="res-score-d">/ 150점</div>
        </div>
      </div>
      <div class="res-grade" id="rgrade"></div>
    </div>

// 정답 수정 (검토 후)
QS[8].ans  = 3;  // Q09: 105 → index 3
QS[7].ans  = 4;  // Q08: (가)-(나)=45 → index 4
QS[13].ans = 0;  // Q14: 576 → index 0
QS[14].ans = 2;  // Q15: 1260 → index 2

// ══════════════════════════════════════════════════════════════
//  STATE & ENGINE
// ══════════════════════════════════════════════════════════════
const LBLS = ['①','②','③','④','⑤'];
let S = {
  cur:0,
  chosen: new Array(QS.length).fill(null),
  done:   new Array(QS.length).fill(false),
  elapsed:0, timer:null, total:60*60
};

function startExam(){
  document.getElementById('splash').classList.add('out');
  document.getElementById('hdr').style.display='block';
  document.getElementById('pbar').style.display='block';
  document.getElementById('app').style.display='block';
  buildNav(); render(0);
  S.timer = setInterval(tick,1000);
}

function tick(){
  S.elapsed++;
  const rem = S.total - S.elapsed;
  if(rem<=0){ clearInterval(S.timer); showResult(); return; }
  const m=Math.floor(rem/60), s=rem%60;
  const el=document.getElementById('tmr');
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(rem<=300) el.classList.add('warn');
}

function buildNav(){
  const c=document.getElementById('qnav'); c.innerHTML='';
  QS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='qdot'+(i===0?' cur':''); d.id=`dot${i}`;
    d.title=`${i+1}번`; d.onclick=()=>go(i);
    c.appendChild(d);
  });
}

function isOk(i){ return S.chosen[i]===QS[i].ans; }
function calcScore(){ return QS.reduce((s,q,i)=>s+(S.done[i]&&isOk(i)?q.pts:0),0); }

function render(idx){
  S.cur=idx; updateNav(); updatePts();
  const q=QS[idx];
  const app=document.getElementById('app');

  // ── 1. 카드 뼈대를 먼저 생성 ──
  const card = document.createElement('div');
  card.className = 'qcard on';

  // stamp
  const stamp = document.createElement('div');
  stamp.className = 'q-stamp';
  stamp.innerHTML =
    '<div class="q-stamp-num" style="opacity:.18">' + String(idx+1).padStart(2,'0') + '</div>' +
    '<div class="q-stamp-meta">' +
      '<div class="q-stamp-cat" style="color:' + q.catC + '">' + q.cat + '</div>' +
      '<div class="q-stamp-title">' + q.title + '</div>' +
      '<div class="q-stamp-pts">+' + q.pts + '점 &nbsp;&middot;&nbsp; ' + (idx+1) + ' / ' + QS.length + '</div>' +
    '</div>';
  card.appendChild(stamp);

  // ── 2. 문제 본문 (innerHTML로 안전하게 주입) ──
  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'q-body';
  bodyDiv.innerHTML = q.body;
  card.appendChild(bodyDiv);

  // ── 3. 선택지 ──
  const optsDiv = document.createElement('div');
  optsDiv.className = 'opts';
  q.opts.forEach(function(o, oi){
    let cls = '';
    if(S.done[idx]){
      if(oi===q.ans) cls='ok';
      else if(oi===S.chosen[idx]) cls='ng';
      cls+=' off';
    } else if(oi===S.chosen[idx]) cls='sel';
    const btn = document.createElement('button');
    btn.className = 'opt ' + cls;
    btn.onclick = (function(qi,oi){ return function(){ pick(qi,oi); }; })(idx,oi);
    const lbl = document.createElement('span');
    lbl.className='opt-lbl'; lbl.textContent=LBLS[oi];
    const txt = document.createElement('span');
    txt.className='opt-txt'; txt.textContent=o;
    btn.appendChild(lbl);
    btn.appendChild(txt);
    if(S.done[idx] && oi===q.ans){
      const chk=document.createElement('span'); chk.className='opt-check'; chk.textContent='✓'; btn.appendChild(chk);
    } else if(S.done[idx] && oi===S.chosen[idx] && oi!==q.ans){
      const chk=document.createElement('span'); chk.className='opt-check'; chk.textContent='✗'; btn.appendChild(chk);
    }
    optsDiv.appendChild(btn);
  });
  card.appendChild(optsDiv);

  // ── 4. 해설 패널 ──
  const explDiv = document.createElement('div');
  explDiv.className = 'expl' + (S.done[idx]?' on':'');

  // banner
  let verdictHtml = '';
  if(S.done[idx]) verdictHtml = isOk(idx)
    ? '<span class="verdict-ok">✓ 정답!</span>'
    : '<span class="verdict-ng">✗ 오답</span>';
  const banner = document.createElement('div');
  banner.className='expl-banner';
  banner.innerHTML = '<div class="expl-banner-icon">解</div>' +
    '<span class="expl-banner-title">풀이 해설</span>' + verdictHtml;
  explDiv.appendChild(banner);

  // concept strip
  if(q.concept){
    const cs = document.createElement('div');
    cs.className='concept-strip';
    cs.innerHTML='<div class="concept-key">'+q.concept.key+'</div>'+
                 '<div class="concept-val">'+q.concept.val+'</div>';
    explDiv.appendChild(cs);
  }

  // ans tag
  const ansPad = document.createElement('div');
  ansPad.style.padding='0 22px';
  const ansTag = document.createElement('div');
  ansTag.className='ans-tag';
  ansTag.textContent='정답: ' + LBLS[q.ans] + ' ' + q.opts[q.ans];
  ansPad.appendChild(ansTag);
  explDiv.appendChild(ansPad);

  // expl body
  const eb = document.createElement('div');
  eb.className='expl-body';
  eb.innerHTML = q.expl;
  if(q.tip){
    const tipEl = document.createElement('div');
    tipEl.className='tip';
    tipEl.innerHTML='<div class="tip-title">💡 '+q.tip.title+'</div>'+q.tip.text;
    eb.appendChild(tipEl);
  }
  explDiv.appendChild(eb);
  card.appendChild(explDiv);

  // ── 5. 네비게이션 ──
  const navRow = document.createElement('div');
  navRow.className='nav-row';

  const btnPrev = document.createElement('button');
  btnPrev.className='nbtn'; btnPrev.textContent='← 이전';
  if(idx===0) btnPrev.disabled=true;
  btnPrev.onclick=function(){ go(idx-1); };
  navRow.appendChild(btnPrev);

  const navRight = document.createElement('div');
  navRight.style.cssText='display:flex;gap:8px';

  if(!S.done[idx]){
    const btnSub=document.createElement('button');
    btnSub.className='nbtn nbtn-sub'; btnSub.textContent='제출하기';
    btnSub.onclick=function(){ sub(idx); };
    navRight.appendChild(btnSub);
  }
  if(idx===QS.length-1){
    const btnEnd=document.createElement('button');
    btnEnd.className='nbtn nbtn-end'; btnEnd.textContent='🏁 채점 완료';
    btnEnd.onclick=showResult;
    navRight.appendChild(btnEnd);
  } else {
    const btnNext=document.createElement('button');
    btnNext.className='nbtn'; btnNext.textContent='다음 →';
    btnNext.onclick=function(){ go(idx+1); };
    navRight.appendChild(btnNext);
  }
  navRow.appendChild(navRight);
  card.appendChild(navRow);

  // ── 6. DOM에 반영 ──
  app.innerHTML='';
  app.appendChild(card);
}

function updateNav(){
  QS.forEach((_,i)=>{
    const d=document.getElementById(`dot${i}`); if(!d)return;
    d.className='qdot';
    if(i===S.cur) d.classList.add('cur');
    else if(S.done[i]) d.classList.add(isOk(i)?'ok':'ng');
    else if(S.chosen[i]!==null) d.classList.add('answered');
  });
}

function updatePts(){
  document.getElementById('pfill').style.width=((S.cur+1)/QS.length*100)+'%';
  document.getElementById('hpts').textContent=`${calcScore()} / 150점`;
}

function pick(qi,oi){ if(S.done[qi])return; S.chosen[qi]=oi; render(qi); }

function sub(qi){
  if(S.chosen[qi]===null) return;
  S.done[qi]=true; render(qi);
}

function go(i){ if(i<0||i>=QS.length)return; render(i); }

function showResult(){
  clearInterval(S.timer);
  const score=calcScore();
  const ok=QS.filter((_,i)=>S.done[i]&&isOk(i)).length;
  const ng=QS.filter((_,i)=>S.done[i]&&!isOk(i)).length;
  const m=Math.floor(S.elapsed/60), s=S.elapsed%60;
  const pct=score/150;

  document.getElementById('rscore').textContent=score;
  document.getElementById('rn-ok').textContent=ok;
  document.getElementById('rn-ng').textContent=ng;
  document.getElementById('rn-t').textContent=`${m}:${String(s).padStart(2,'0')}`;

  // arc
  const arc=document.getElementById('arc');
  arc.style.strokeDashoffset=490-(490*pct);
  if(pct>=.8) arc.setAttribute('stroke','#4ecdc4');
  else if(pct>=.6) arc.setAttribute('stroke','#e8c547');
  else arc.setAttribute('stroke','#e85d75');

  let grade='',gc='';
  if(pct>=.93){grade='🏆 만점에 가깝다 — 금상';gc='#e8c547';}
  else if(pct>=.8){grade='✨ 우수 — 은상 수준';gc='#b0bec5';}
  else if(pct>=.67){grade='💎 양호 — 동상 수준';gc='#cd7f32';}
  else if(pct>=.5){grade='📐 보통 — 더 연습하자';gc='#7eb8f7';}
  else{grade='💪 도전! — 다시 시도해보자';gc='#8888aa';}
  const rg=document.getElementById('rgrade');
  rg.textContent=grade; rg.style.color=gc;

  const list=document.getElementById('rlist'); list.innerHTML='';
  QS.forEach((q,i)=>{
    const ok2=S.done[i]&&isOk(i), ng2=S.done[i]&&!isOk(i);
    const d=document.createElement('div');
    d.className=`rev-row ${ok2?'ok':''} ${ng2?'ng':''}`;
    d.innerHTML=`<div class="rev-row-n">Q${String(i+1).padStart(2,'0')}<br>${q.pts}점</div>
      <div class="rev-row-t"><span style="font-family:'DM Mono',monospace;font-size:10px;color:${q.catC}">${q.cat}</span><br>${q.title}</div>
      <div class="rev-row-m">${ok2?'✅':ng2?'❌':'⬜'}</div>`;
    d.onclick=()=>{ document.getElementById('result').classList.remove('on'); render(i); };
    list.appendChild(d);
  });

  document.getElementById('result').classList.add('on');
}

function restartExam(){
  S={cur:0,chosen:new Array(QS.length).fill(null),done:new Array(QS.length).fill(false),elapsed:0,timer:null,total:60*60};
  document.getElementById('result').classList.remove('on');
  document.getElementById('tmr').textContent='60:00';
  document.getElementById('tmr').classList.remove('warn');
  buildNav(); render(0);
  S.timer=setInterval(tick,1000);
}
</script>
</body>
</html>
