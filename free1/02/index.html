<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이산수학 1장 수의 표현과 연산 심화 문제 50</title>
<style>
  :root{
    --bg:#f6f8ff;--card:#ffffff;--ink:#172033;--muted:#64748b;--main:#4f46e5;--sub:#06b6d4;--ok:#16a34a;--bad:#dc2626;--soft:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Noto Sans KR',Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#ecfeff 55%,#fff7ed);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb;padding:18px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between}
  h1{font-size:24px;margin:0;color:#312e81}.subtitle{font-size:14px;color:var(--muted);margin-top:5px}
  .score{background:#111827;color:white;padding:12px 16px;border-radius:18px;font-weight:700;white-space:nowrap}.score span{color:#67e8f9}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}
  .intro{background:linear-gradient(135deg,#4338ca,#0891b2);color:white;border-radius:26px;padding:28px;margin-bottom:22px;box-shadow:0 18px 45px rgba(30,41,59,.18)}
  .intro h2{margin:0 0 10px;font-size:28px}.intro p{margin:8px 0;line-height:1.7}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.controls button{border:0;border-radius:999px;padding:12px 16px;background:#fff;color:#1e293b;box-shadow:0 6px 18px rgba(15,23,42,.09);cursor:pointer;font-weight:700}.controls button:hover{background:#eef2ff;color:#3730a3}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.qcard{background:var(--card);border:1px solid #e5e7eb;border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(15,23,42,.08);position:relative;overflow:hidden}.qcard:before{content:"";position:absolute;right:-38px;top:-38px;width:120px;height:120px;border-radius:50%;background:rgba(79,70,229,.08)}
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.num{background:var(--soft);color:#3730a3;border-radius:999px;padding:7px 11px;font-weight:800}.tag{font-size:12px;background:#ecfeff;color:#0e7490;border-radius:999px;padding:6px 10px;font-weight:700}.q{font-size:17px;line-height:1.65;margin:16px 0;font-weight:700}.hint{font-size:13px;color:var(--muted);line-height:1.55;background:#f8fafc;border-left:4px solid #c7d2fe;padding:10px;border-radius:12px;margin-bottom:12px}
  input{width:100%;border:2px solid #e5e7eb;border-radius:16px;padding:13px;font-size:16px;outline:none}input:focus{border-color:#6366f1;background:#f8fafc}.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:10px 13px;cursor:pointer;font-weight:800}.check{background:#4f46e5;color:white}.show{background:#e0f2fe;color:#0369a1}.reset{background:#fee2e2;color:#991b1b}.result{margin-top:12px;font-weight:800;min-height:24px}.correct{color:var(--ok)}.wrong{color:var(--bad)}.explain{display:none;margin-top:12px;background:#f8fafc;border-radius:16px;padding:13px;line-height:1.65;color:#334155;border:1px dashed #cbd5e1}.footer{margin:28px 0;text-align:center;color:#64748b;font-size:14px}
  code{background:#eef2ff;color:#3730a3;border-radius:6px;padding:1px 5px;font-weight:700}
</style>
</head>
<body>
<header>
  <div><h1>이산수학 1장 심화 문제 50</h1><div class="subtitle">수의 표현과 연산: 진법 변환, 보수, 오버플로, 비트 연산, 진법 사칙연산</div></div>
  <div class="score">점수 <span id="score">0</span> / 50</div>
</header>
<div class="wrap">
  <section class="intro">
    <h2>심화 학습 목표</h2>
    <p>1. 여러 진법을 자유롭게 변환하고, 진법별 사칙연산을 직접 계산합니다.</p>
    <p>2. 컴퓨터가 음수를 표현하는 방법인 2의 보수, 비트 수 제한, 오버플로를 이해합니다.</p>
    <p>3. 비트 연산 AND, OR, XOR, SHIFT를 이용해 수를 빠르게 처리하는 사고를 익힙니다.</p>
  </section>
  <div class="controls">
    <button onclick="filterCards('all')">전체</button>
    <button onclick="filterCards('진법변환')">진법변환</button>
    <button onclick="filterCards('진법연산')">진법연산</button>
    <button onclick="filterCards('보수표현')">보수표현</button>
    <button onclick="filterCards('비트연산')">비트연산</button>
    <button onclick="filterCards('응용')">응용</button>
    <button onclick="resetAll()">전체 초기화</button>
  </div>
  <main class="grid" id="quiz"></main>
  <div class="footer">정답 입력은 대소문자를 구분하지 않습니다. 2진수는 1010처럼, 16진수는 A3처럼 입력하세요.</div>
</div>
<script>
const problems = [
{cat:'진법변환',q:'10진수 345를 2진수로 바꾸시오.',a:['101011001'],h:'345 = 256+64+16+8+1 이므로 2진수는 101011001입니다.'},
{cat:'진법변환',q:'2진수 110101101₂를 10진수로 바꾸시오.',a:['429'],h:'256+128+32+8+4+1 = 429입니다.'},
{cat:'진법변환',q:'10진수 2026을 16진수로 바꾸시오.',a:['7EA'],h:'2026 ÷ 16 = 126 나머지 10(A), 126 ÷ 16 = 7 나머지 14(E), 따라서 7EA입니다.'},
{cat:'진법변환',q:'16진수 3F7을 2진수로 바꾸시오.',a:['1111110111','001111110111'],h:'3=0011, F=1111, 7=0111이므로 0011 1111 0111, 앞 0 제거 시 1111110111입니다.'},
{cat:'진법변환',q:'8진수 735₈를 2진수로 바꾸시오.',a:['111011101'],h:'7=111, 3=011, 5=101이므로 111011101입니다.'},
{cat:'진법변환',q:'2진수 101111001₂를 8진수로 바꾸시오.',a:['571'],h:'오른쪽부터 3개씩 묶으면 101 111 001 → 5 7 1입니다.'},
{cat:'진법변환',q:'5진수 4321₅을 10진수로 바꾸시오.',a:['586'],h:'4×125 + 3×25 + 2×5 + 1 = 586입니다.'},
{cat:'진법변환',q:'10진수 586을 5진수로 바꾸시오.',a:['4321'],h:'586을 5로 계속 나누면 나머지가 1,2,3,4 순서로 나와 거꾸로 4321입니다.'},
{cat:'진법변환',q:'3진수 102201₃을 10진수로 바꾸시오.',a:['334'],h:'1×243 + 0×81 + 2×27 + 2×9 + 0×3 + 1 = 334입니다.'},
{cat:'진법변환',q:'10진수 334를 3진수로 바꾸시오.',a:['102201'],h:'334를 3으로 나누며 나머지를 거꾸로 읽으면 102201입니다.'},

{cat:'진법연산',q:'2진수 101101₂ + 11101₂의 결과를 2진수로 쓰시오.',a:['1001010'],h:'45 + 29 = 74이고, 74는 2진수로 1001010입니다.'},
{cat:'진법연산',q:'2진수 1000000₂ - 101011₂의 결과를 2진수로 쓰시오.',a:['10101'],h:'64 - 43 = 21이고, 21은 10101₂입니다.'},
{cat:'진법연산',q:'2진수 1101₂ × 1011₂의 결과를 2진수로 쓰시오.',a:['10001111'],h:'13 × 11 = 143이고, 143은 10001111₂입니다.'},
{cat:'진법연산',q:'8진수 754₈ + 267₈의 결과를 8진수로 쓰시오.',a:['1243'],h:'754₈=492, 267₈=183, 합은 675이고 8진수로 1243입니다.'},
{cat:'진법연산',q:'8진수 1000₈ - 357₈의 결과를 8진수로 쓰시오.',a:['421'],h:'512 - 239 = 273이고, 273은 421₈입니다.'},
{cat:'진법연산',q:'16진수 A7₁₆ + 5C₁₆의 결과를 16진수로 쓰시오.',a:['103'],h:'0xA7=167, 0x5C=92, 합은 259=0x103입니다.'},
{cat:'진법연산',q:'16진수 1F4₁₆ - C9₁₆의 결과를 16진수로 쓰시오.',a:['12B'],h:'0x1F4=500, 0xC9=201, 차는 299=0x12B입니다.'},
{cat:'진법연산',q:'16진수 2A₁₆ × 4₁₆의 결과를 16진수로 쓰시오.',a:['A8'],h:'0x2A=42, 42×4=168이고 168은 0xA8입니다.'},
{cat:'진법연산',q:'2진수 11110000₂ ÷ 1000₂의 몫을 2진수로 쓰시오.',a:['11110'],h:'240 ÷ 8 = 30이고, 30은 11110₂입니다.'},
{cat:'진법연산',q:'4진수 321₄ + 123₄의 결과를 4진수로 쓰시오.',a:['1110'],h:'321₄=57, 123₄=27, 합 84는 4진수로 1110입니다.'},

{cat:'보수표현',q:'8비트 2의 보수에서 -1을 2진수로 표현하시오.',a:['11111111'],h:'+1은 00000001, 반전 11111110, +1 하면 11111111입니다.'},
{cat:'보수표현',q:'8비트 2의 보수에서 -37을 2진수로 표현하시오.',a:['11011011'],h:'+37=00100101, 반전 11011010, +1 → 11011011입니다.'},
{cat:'보수표현',q:'8비트 2의 보수 11101010₂는 10진수로 얼마인가?',a:['-22'],h:'맨 앞 비트가 1이므로 음수입니다. 반전 00010101, +1 → 00010110=22, 따라서 -22입니다.'},
{cat:'보수표현',q:'8비트 2의 보수 10000000₂는 10진수로 얼마인가?',a:['-128'],h:'8비트 2의 보수 범위는 -128부터 127입니다. 10000000은 가장 작은 값 -128입니다.'},
{cat:'보수표현',q:'8비트 2의 보수에서 표현 가능한 가장 큰 양의 정수는?',a:['127'],h:'맨 앞 비트는 부호로 사용되므로 01111111₂ = 127입니다.'},
{cat:'보수표현',q:'8비트 2의 보수에서 75 + 60을 계산하면 오버플로가 발생하는가? 예/아니오로 쓰시오.',a:['예','yes','y'],h:'75+60=135입니다. 8비트 2의 보수 최대값은 127이므로 오버플로가 발생합니다.'},
{cat:'보수표현',q:'8비트 2의 보수에서 -70 + -80을 계산하면 오버플로가 발생하는가? 예/아니오로 쓰시오.',a:['예','yes','y'],h:'-150은 8비트 범위 -128보다 작으므로 오버플로입니다.'},
{cat:'보수표현',q:'8비트 2의 보수에서 50 + (-20)의 결과를 10진수로 쓰시오.',a:['30'],h:'50-20=30이며 범위 안에 있으므로 결과는 30입니다.'},
{cat:'보수표현',q:'4비트 2의 보수에서 표현 가능한 정수 범위는? 예: -3~4',a:['-8~7','-8 ~ 7'],h:'n비트 2의 보수 범위는 -2^(n-1)부터 2^(n-1)-1입니다. 4비트는 -8~7입니다.'},
{cat:'보수표현',q:'4비트 2의 보수에서 0111₂ + 0001₂의 실제 결과는 오버플로이다. 4비트 저장 결과를 쓰시오.',a:['1000'],h:'0111은 7, 0001은 1입니다. 7+1=8은 표현 불가이고, 4비트에는 1000이 저장됩니다.'},

{cat:'비트연산',q:'10110110₂ AND 11001100₂의 결과를 쓰시오.',a:['10000100'],h:'둘 다 1인 자리만 1입니다. 결과는 10000100입니다.'},
{cat:'비트연산',q:'10110110₂ OR 11001100₂의 결과를 쓰시오.',a:['11111110'],h:'둘 중 하나라도 1이면 1입니다. 결과는 11111110입니다.'},
{cat:'비트연산',q:'10110110₂ XOR 11001100₂의 결과를 쓰시오.',a:['01111010','1111010'],h:'서로 다르면 1입니다. 결과는 01111010입니다.'},
{cat:'비트연산',q:'00110101₂를 왼쪽으로 2비트 시프트한 결과를 8비트로 쓰시오.',a:['11010100'],h:'왼쪽으로 2칸 밀고 오른쪽에 0을 채우면 11010100입니다.'},
{cat:'비트연산',q:'11010100₂를 오른쪽으로 3비트 논리 시프트한 결과를 8비트로 쓰시오.',a:['00011010'],h:'오른쪽으로 3칸 밀고 왼쪽에 0을 채우면 00011010입니다.'},
{cat:'비트연산',q:'10진수 37을 1비트 왼쪽 시프트하면 10진수로 얼마인가?',a:['74'],h:'왼쪽으로 1비트 이동은 2배와 같습니다. 37×2=74입니다.'},
{cat:'비트연산',q:'10진수 96을 3비트 오른쪽 논리 시프트하면 10진수로 얼마인가?',a:['12'],h:'오른쪽 3비트 이동은 8로 나눈 몫과 같습니다. 96÷8=12입니다.'},
{cat:'비트연산',q:'어떤 수 x의 홀짝을 확인할 때 사용하는 비트 연산식은 x AND 몇인가?',a:['1'],h:'마지막 비트가 1이면 홀수, 0이면 짝수입니다. x AND 1을 사용합니다.'},
{cat:'비트연산',q:'13 XOR 13의 값은?',a:['0'],h:'같은 비트끼리 XOR하면 모두 0이 됩니다.'},
{cat:'비트연산',q:'2진수 100000₂은 10진수로 2의 몇 제곱인가? 숫자만 쓰시오.',a:['5'],h:'100000₂은 32이고, 32=2^5입니다.'},

{cat:'응용',q:'10진수 255를 8비트 2진수와 16진수로 표현하면? 형식: 2진수,16진수',a:['11111111,FF','11111111, ff','11111111,ff'],h:'255는 8비트로 11111111이고, 16진수로 FF입니다.'},
{cat:'응용',q:'16비트 unsigned 정수의 최댓값은?',a:['65535'],h:'unsigned n비트의 범위는 0부터 2^n-1입니다. 2^16-1=65535입니다.'},
{cat:'응용',q:'8비트 unsigned에서 250 + 10을 저장하면 실제 저장되는 값은?',a:['4'],h:'260을 256으로 나눈 나머지가 저장됩니다. 260 mod 256 = 4입니다.'},
{cat:'응용',q:'8비트 unsigned에서 3 - 5를 저장하면 실제 저장되는 값은?',a:['254'],h:'-2를 256 기준으로 저장하면 254입니다.'},
{cat:'응용',q:'RGB 색상 #3A7F10에서 초록색 G 값은 16진수로 무엇인가?',a:['7F'],h:'RGB는 #RRGGBB입니다. #3A 7F 10에서 G는 7F입니다.'},
{cat:'응용',q:'16진수 FF00₁₆ AND 0F0F₁₆의 결과를 16진수로 쓰시오.',a:['0F00','F00'],h:'FF00 AND 0F0F = 0F00입니다.'},
{cat:'응용',q:'2진수 1010을 4번 왼쪽 시프트한 결과를 16진수로 쓰시오.',a:['A0'],h:'1010 << 4 = 10100000₂이고, 16진수로 A0입니다.'},
{cat:'응용',q:'10진수 1024는 2진수로 1 뒤에 0이 몇 개 붙는가?',a:['10'],h:'1024=2^10이므로 1 뒤에 0이 10개 붙습니다.'},
{cat:'응용',q:'16진수 1000₁₆은 10진수로 얼마인가?',a:['4096'],h:'16^3 = 4096입니다.'},
{cat:'응용',q:'8비트 2의 보수에서 11111110₂ + 00000011₂의 결과를 10진수로 쓰시오.',a:['1'],h:'11111110은 -2, 00000011은 3입니다. -2+3=1입니다.'}
];
let solved = Array(problems.length).fill(false);
function norm(s){return String(s).trim().toUpperCase().replace(/\s+/g,'');}
function render(){
  const box=document.getElementById('quiz');
  box.innerHTML='';
  problems.forEach((p,i)=>{
    const card=document.createElement('section');
    card.className='qcard'; card.dataset.cat=p.cat;
    card.innerHTML=`<div class="qtop"><span class="num">문제 ${i+1}</span><span class="tag">${p.cat}</span></div>
    <div class="q">${p.q}</div>
    <div class="hint">힌트: 답은 문제에서 요구한 진법 또는 형식 그대로 입력하세요.</div>
    <input id="ans${i}" placeholder="정답 입력">
    <div class="btns"><button class="btn check" onclick="check(${i})">정답 확인</button><button class="btn show" onclick="toggleExplain(${i})">해설 보기</button><button class="btn reset" onclick="resetOne(${i})">초기화</button></div>
    <div class="result" id="res${i}"></div><div class="explain" id="exp${i}">${p.h}<br><b>정답:</b> ${p.a[0]}</div>`;
    box.appendChild(card);
  })
}
function check(i){
  const v=norm(document.getElementById('ans'+i).value);
  const ok=problems[i].a.some(x=>norm(x)===v);
  const r=document.getElementById('res'+i);
  if(ok){r.textContent='정답입니다!';r.className='result correct'; if(!solved[i]){solved[i]=true; updateScore();}}
  else{r.textContent='아직 틀렸습니다. 해설을 보고 다시 생각해 보세요.';r.className='result wrong';}
}
function toggleExplain(i){const e=document.getElementById('exp'+i);e.style.display=e.style.display==='block'?'none':'block'}
function resetOne(i){document.getElementById('ans'+i).value='';document.getElementById('res'+i).textContent='';document.getElementById('exp'+i).style.display='none';if(solved[i]){solved[i]=false;updateScore();}}
function resetAll(){solved=Array(problems.length).fill(false);render();updateScore();}
function updateScore(){document.getElementById('score').textContent=solved.filter(Boolean).length;}
function filterCards(cat){document.querySelectorAll('.qcard').forEach(c=>{c.style.display=(cat==='all'||c.dataset.cat===cat)?'block':'none';});}
render();
</script>
</body>
</html>
